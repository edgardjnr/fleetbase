        sender-id-help: Defina o nome alfanumérico personalizado que aparecerá como remetente de todos os SMS enviados pela sua organização. Até 11 letras ou números. Não é aceito em todos os países.
        sender-id-info-1: "IDs de remetente alfanuméricos permitem que sua organização substitua o número de telefone tradicional por um nome de remetente em texto ao enviar notificações por SMS (ex.: RestaurantePro, MinhaLoja, CentralDespacho). Isso pode melhorar o reconhecimento da marca, aumentar a confiança nas mensagens e melhorar a entrega em regiões onde as operadoras locais restringem remetentes numéricos."
        sender-id-info-2: Quando ativado, o sistema usará este ID de remetente em todos os SMS enviados em nome da sua organização, incluindo atualizações de pedidos, códigos de verificação, notificações de motoristas e outros alertas automáticos. IDs de remetente podem ter até 11 caracteres entre letras e números.
        sender-id-info-3: Alguns países exigem regras específicas de mensagens, e certas operadoras só aceitam remetentes alfanuméricos. Usar um ID de remetente pode melhorar bastante a entrega de mensagens nessas regiões.
        sender-id-warning: A entrega de SMS com IDs de remetente alfanuméricos depende das políticas das operadoras locais. Algumas regiões podem restringir ou bloquear remetentes numéricos ou exigir remetentes alfanuméricos para a entrega. Embora o sistema tente entregar todas as mensagens usando o ID de remetente configurado, a entrega não pode ser garantida em países com filtragem pelas operadoras ou restrições regulatórias. Sua organização é responsável por cumprir as normas locais de mensagens nos países para os quais envia SMS.
