menu-text:
  iam:
    title: IAM
    description: 'Gestão de identidade e acesso: usuários, papéis, políticas e permissões.'
  iam-sc-users:
    title: Usuários
    description: Gerencie as contas de usuário do console e seus níveis de acesso.
  iam-sc-drivers:
    title: Motoristas
    description: Veja e gerencie as contas de motoristas vinculadas à sua organização.
  iam-sc-customers:
    title: Clientes
    description: Veja e gerencie as contas de clientes vinculadas à sua organização.
  iam-sc-groups:
    title: Grupos
    description: Organize usuários em grupos para gerenciar permissões em conjunto.
  iam-sc-roles:
    title: Papéis
    description: Defina papéis que agrupam conjuntos de permissões.
  iam-sc-policies:
    title: Políticas
    description: Crie políticas de controle de acesso detalhadas para os recursos.
widget-text:
  iam-kpi-active-users:
    name: Usuários ativos
    description: Usuários ativos que podem acessar a organização no momento.
  iam-kpi-pending-invites:
    name: Convites pendentes
    description: Usuários convidados ou aguardando verificação.
  iam-kpi-inactive-users:
    name: Usuários inativos
    description: Usuários com acesso à organização inativo.
  iam-kpi-dormant-users:
    name: Usuários sem atividade
    description: Usuários sem login recente.
  iam-kpi-mfa-coverage:
    name: Cobertura de MFA
    description: Parcela de usuários com autenticação em dois fatores ativada, quando disponível.
  iam-kpi-roles:
    name: Papéis
    description: Papéis de IAM gerenciados pela organização.
  iam-kpi-policies:
    name: Políticas
    description: Políticas de acesso gerenciadas pela organização.
  iam-user-type-creation-trend:
    name: Usuários criados por tipo ao longo do tempo
    description: Novas identidades criadas por tipo de usuário no período selecionado.
  iam-access-risk:
    name: Risco de acesso
    description: Papéis privilegiados, políticas curinga e concessões privilegiadas diretas.
  iam-policy-surface:
    name: Panorama de políticas
    description: Políticas agrupadas por serviço e responsável.
  iam-recent-activity:
    name: Atividade recente de IAM
    description: Alterações recentes em usuários, grupos, papéis e políticas.
  iam-quick-actions:
    name: Ações rápidas de IAM
    description: Atalhos para tarefas comuns de gestão de IAM.
  iam-metrics-widget:
    name: Métricas de IAM (legado)
    description: Métricas de uso de IAM agrupadas (versão antiga).
