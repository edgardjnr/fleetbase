        extension-subscription-amount: Valor da assinatura
        extension-subscription-amount-help-text: Informe o valor padrão cobrado pela assinatura. Ele deve refletir o preço normal, antes de descontos ou ajustes por faixa.
        extension-subscription-model: Modelo de assinatura
        extension-subscription-model-help-text: Define o modelo de preço da assinatura. As opções são valor fixo, por faixas e por uso.
        extension-subscription-tiers: Faixas de assinatura
        extension-subscription-tiers-help-text: Defina as diferentes faixas de preço da assinatura, se houver. Inclua os níveis, o preço de cada faixa e os recursos ou limitações específicos de cada uma.
        extension-name-help-text: Informe o nome oficial da extensão. Ele será exibido como identificador principal para os usuários.
        extension-icon-help-text: Envie um ícone que represente a extensão. Ele será usado nas listagens e nos resultados de busca.
        extension-description-help-text: Descreva em detalhes o que a extensão faz e seus principais recursos. Isso ajuda os usuários a entender a funcionalidade da extensão.
        extension-tags-help-text: Adicione palavras-chave e tags relevantes que descrevam a extensão, ajudando os usuários a encontrá-la na busca.
        extension-promotional-text-help-text: Escreva um texto promocional destacando os diferenciais da extensão. Ele será usado em seções de marketing ou de destaque.
        extension-subtitle-help-text: Informe um subtítulo curto com contexto ou informações adicionais sobre a extensão.
        extension-website-url-help-text: Informe a URL do site oficial ou da página do produto da extensão para mais informações.
        extension-repo-url-help-text: Informe a URL do repositório de código da extensão (por exemplo, GitHub, GitLab), se houver.
        extension-support-url-help-text: Informe a URL onde os usuários podem obter suporte, tirar dúvidas ou relatar problemas com a extensão.
        extension-privacy-policy-url-help-text: Link para a política de privacidade que descreve como os dados dos usuários são tratados e protegidos.
        extension-tos-url-help-text: Link para os termos de serviço que os usuários devem aceitar antes de usar a extensão.
        extension-primary-language-help-text: Informe o idioma principal em que a extensão foi desenvolvida ou está disponível.
        extension-version-help-text: Indique a versão atual da extensão. Isso é importante para acompanhar atualizações e a compatibilidade.
