    description: Percentual de requisições de API que retornam erro.
  developers-kpi-api-latency:
    name: Latência média da API
    description: Tempo médio de resposta da API no período atual.
  developers-kpi-webhook-success:
    name: Taxa de sucesso dos webhooks
    description: Percentual de entregas de webhook com resposta 2xx.
  developers-kpi-active-api-keys:
    name: Chaves de API ativas
    description: Credenciais de API ativas nesta organização.
  developers-kpi-active-webhooks:
    name: Webhooks ativos
    description: Endpoints de webhook habilitados nesta organização.
  developers-kpi-webhook-failures:
    name: Falhas de webhook
    description: Entregas de webhook com falha no período atual.
  developers-kpi-events-emitted:
    name: Eventos emitidos
    description: Eventos da plataforma emitidos no período atual.
  developers-api-traffic:
    name: Tráfego da API
    description: Volume de requisições, sucessos e erros da API ao longo do tempo.
  developers-webhook-delivery:
    name: Saúde das entregas de webhook
    description: Volume, sucesso, falhas e novas tentativas das entregas de webhook.
  developers-endpoint-health:
    name: Saúde dos endpoints
    description: Saúde das entregas por endpoint de webhook e falhas recentes.
  developers-event-stream:
    name: Fluxo de eventos
    description: Principais tipos e origens de eventos no período selecionado.
