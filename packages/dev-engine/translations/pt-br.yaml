menu-text:
  developers:
    title: Desenvolvedores
    description: Chaves de API, webhooks, canais de socket, logs de eventos e ferramentas para desenvolvedores.
  developers-sc-api-keys:
    title: Chaves de API
    description: Crie e gerencie chaves de API para autenticar suas integrações.
  developers-sc-webhooks:
    title: Webhooks
    description: Configure endpoints de webhook para receber notificações de eventos em tempo real.
  developers-sc-sockets:
    title: Sockets
    description: Monitore canais WebSocket ativos e clientes conectados.
  developers-sc-events:
    title: Eventos
    description: Navegue pelo histórico completo de eventos e payloads da plataforma.
  developers-sc-logs:
    title: Logs
    description: Inspecione logs de requisições e respostas da API para depuração.
widget-text:
  developers-kpi-api-requests:
    name: Requisições de API
    description: Total de requisições de API no período atual.
  developers-kpi-api-error-rate:
