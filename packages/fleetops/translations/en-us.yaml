            optimizationObjectives:
                min-distance:
                    label: Minimize Total Distance
                    description: Produce routes with the shortest total travel distance.
                min-duration:
                    label: Minimize Total Duration
                    description: Produce routes with the shortest total travel time.
                min-vehicles:
                    label: Minimize Vehicles Used
                    description: Use as few vehicles as possible while serving all orders.
                balance-workload:
                    label: Balance Workload
                    description: Distribute stops evenly across all available drivers.
                max-on-time:
                    label: Maximize On-Time Delivery
                    description: Prioritise serving stops within their time windows.
                min-overtime:
                    label: Minimize Overtime
                    description: Keep driver working hours within contracted limits.
                min-emissions:
                    label: Minimize Fuel / Emissions
                    description: Optimize for lowest fuel consumption and CO₂ output.
            routingConstraintOptions:
                respect-time-windows:
                    label: Respect Time Windows
                    description: Enforce delivery/pickup time windows as hard constraints.
                respect-capacity:
                    label: Respect Vehicle Capacity
                    description: Do not exceed vehicle weight, volume, or unit capacity.
                respect-skills:
                    label: Respect Driver Skills
                    description: Only assign orders to drivers/vehicles with matching skills.
                respect-max-tasks:
                    label: Respect Max Tasks per Route
                    description: Do not exceed the maximum number of stops per vehicle.
                respect-max-travel-time:
                    label: Respect Max Travel Time
                    description: Do not exceed the maximum driving time per vehicle/driver.
                respect-max-distance:
                    label: Respect Max Distance
                    description: Do not exceed the maximum distance per vehicle/driver.
                allow-unassigned:
                    label: Allow Unassigned Orders
                    description: Permit orders to remain unassigned if no feasible vehicle exists.
                pickup-before-delivery:
                    label: Pickup Before Delivery
                    description: Enforce pickup-before-dropoff sequencing for P&D orders.
                return-to-depot:
                    label: Return to Depot
                    description: Require vehicles to return to their start depot after the last stop.
                avoid-highways:
                    label: Avoid Highways
                    description: Route via non-highway roads where possible.
                avoid-tolls:
                    label: Avoid Tolls
                    description: Route to avoid toll roads where possible.
                avoid-ferries:
                    label: Avoid Ferries
                    description: Route to avoid ferry crossings where possible.
