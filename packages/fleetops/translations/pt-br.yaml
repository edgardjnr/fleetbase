      orderPriorityLevels:
        100:
          label: Crítica
          description: Deve ser atendido primeiro — SLA prestes a estourar ou entrega emergencial.
        75:
          label: Alta
          description: Pedido de alta prioridade; atender antes dos pedidos padrão.
        50:
          label: Padrão
          description: Prioridade normal — padrão para todos os pedidos.
        25:
          label: Baixa
          description: Pedido de baixa prioridade; atender após as paradas de maior prioridade.
        10:
          label: Flexível
          description: Sem exigência rígida de horário; preenche a capacidade restante.
      timeWindowPresets:
        early-morning:
          label: Início da Manhã (06:00–09:00)
          description: Janela de entrega antes do horário comercial.
        morning:
          label: Manhã (08:00–12:00)
          description: Janela de entrega padrão da manhã.
        midday:
          label: Meio-dia (11:00–14:00)
          description: Janela de entrega no horário de almoço.
        afternoon:
          label: Tarde (12:00–17:00)
          description: Janela de entrega padrão da tarde.
        business-hours:
          label: Horário Comercial (09:00–17:00)
          description: Janela de horário comercial completo.
        evening:
          label: Noite (17:00–21:00)
          description: Entrega residencial após o horário comercial.
        night:
          label: Madrugada (21:00–06:00)
          description: Entrega noturna ou de madrugada.
        am-only:
          label: Somente Manhã (antes das 12:00)
          description: Deve ser entregue antes do meio-dia.
        pm-only:
          label: Somente Tarde (após as 12:00)
          description: Deve ser entregue após o meio-dia.
        anytime:
          label: Qualquer Horário
          description: Sem restrição de horário — entregar a qualquer hora.
      optimizationObjectives:
        min-distance:
          label: Minimizar Distância Total
          description: Gera rotas com a menor distância total percorrida.
        min-duration:
          label: Minimizar Duração Total
          description: Gera rotas com o menor tempo total de viagem.
        min-vehicles:
          label: Minimizar Veículos Usados
          description: Usa o mínimo de veículos possível atendendo todos os pedidos.
        balance-workload:
          label: Equilibrar Carga de Trabalho
          description: Distribui as paradas igualmente entre todos os motoristas disponíveis.
        max-on-time:
          label: Maximizar Entregas no Prazo
          description: Prioriza atender as paradas dentro de suas janelas de horário.
        min-overtime:
          label: Minimizar Horas Extras
          description: Mantém a jornada dos motoristas dentro dos limites contratados.
        min-emissions:
          label: Minimizar Combustível / Emissões
          description: Otimiza para o menor consumo de combustível e emissão de CO₂.
      routingConstraintOptions:
        respect-time-windows:
          label: Respeitar Janelas de Horário
          description: Aplica as janelas de entrega/coleta como restrições rígidas.
        respect-capacity:
          label: Respeitar Capacidade do Veículo
          description: Não excede a capacidade de peso, volume ou unidades do veículo.
        respect-skills:
          label: Respeitar Habilidades do Motorista
          description: Atribui pedidos apenas a motoristas/veículos com as habilidades exigidas.
        respect-max-tasks:
          label: Respeitar Máximo de Tarefas por Rota
          description: Não excede o número máximo de paradas por veículo.
        respect-max-travel-time:
          label: Respeitar Tempo Máximo de Viagem
          description: Não excede o tempo máximo de direção por veículo/motorista.
        respect-max-distance:
          label: Respeitar Distância Máxima
          description: Não excede a distância máxima por veículo/motorista.
        allow-unassigned:
          label: Permitir Pedidos Não Atribuídos
          description: Permite que pedidos fiquem sem atribuição se não houver veículo viável.
        pickup-before-delivery:
          label: Coleta Antes da Entrega
          description: Exige a sequência coleta-antes-da-entrega nos pedidos de coleta e entrega.
        return-to-depot:
          label: Retornar à Base
          description: Exige que os veículos retornem à base de origem após a última parada.
        avoid-highways:
          label: Evitar Rodovias
          description: Prefere vias fora de rodovias sempre que possível.
        avoid-tolls:
          label: Evitar Pedágios
          description: Evita vias com pedágio sempre que possível.
        avoid-ferries:
          label: Evitar Balsas
          description: Evita travessias de balsa sempre que possível.
