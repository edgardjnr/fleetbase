<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 005: tela de pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link id="theme" rel="stylesheet" href="../themes/entregas.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #e7e2da; font-family: system-ui, sans-serif; color: #1c1917; }
body.dark-chrome { background: #0c0a09; }
button, input, select { font: inherit; color: inherit; }

/* ---------- moldura do sketch (fora da tela) ---------- */
#chrome { position: sticky; top: 0; z-index: 50; background: #1c1917; color: #e7e5e4; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
#chrome .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#chrome .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a8a29e; margin-right: 6px; font-weight: 700; min-width: 56px; }
.chip { border: 1px solid #44403c; background: #292524; color: #e7e5e4; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; transition: all .15s ease; flex: none; }
.chip:hover { border-color: #fb923c; }
.chip.on { background: #ea7a1a; border-color: #ea7a1a; color: #1c1917; font-weight: 600; }
.chip.cmp { border-style: dashed; }
.chip.cmp.on { border-style: solid; }
#desc { font-size: 13px; color: #d6d3d1; max-width: 1200px; line-height: 1.45; }
#desc b { color: #fff; }
#stage { padding: 16px 24px 60px; }
.single { display: flex; justify-content: center; }
.cmpgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.cmpcol h3 { margin: 0 0 8px; font-size: 14px; color: #1c1917; }
body.dark-chrome .cmpcol h3 { color: #e7e5e4; }
.frame { width: max-content; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 40px rgb(28 25 23 / 25%); }
.frame.phone { border-radius: 34px; border: 10px solid #1c1917; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1c1917; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all .2s ease; z-index: 300; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui; font-size: 12px; background: rgba(0,0,0,.75); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: .45; transition: opacity .2s; display: flex; gap: 8px; align-items: center; }
#sketch-tools:hover { opacity: 1; }
#sketch-tools select, #sketch-tools button { background: #292524; color: #fff; border: 1px solid #44403c; border-radius: 6px; padding: 3px 6px; cursor: pointer; font-size: 12px; }
#sketch-tools button.on { background: #ea7a1a; border-color: #ea7a1a; color: #1c1917; }
body.annot .pf [data-block] { outline: 2px dashed #c026d3; outline-offset: -2px; }
body.annot .pf [data-block]::after { content: attr(data-block); position: absolute; top: 4px; right: 6px; background: #c026d3; color: #fff; font: 600 11px system-ui; padding: 1px 6px; border-radius: 4px; z-index: 40; pointer-events: none; }
body.annot .pf [data-block]:not(.ov):not(.mapwrap):not(.sheet) { position: relative; }

/* modal de atribuir */
#modal { position: fixed; inset: 0; z-index: 200; display: none; place-items: center; background: rgb(28 25 23 / 45%); backdrop-filter: blur(3px); }
#modal.show { display: grid; }
#modal .box { width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border-radius: 16px; box-shadow: var(--shadow-lg); font-family: var(--font-body); overflow: hidden; animation: subir .18s ease; }
@keyframes subir { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
#modal .mh { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
#modal .mh h2 { margin: 0; font-family: var(--font-display); font-size: 24px; text-transform: uppercase; }
#modal .mh p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
#modal .ml { max-height: 340px; overflow: auto; }
#modal .mr { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
#modal .mr img { width: 30px; height: 30px; }
#modal .mr div { flex: 1; }
#modal .mr small { display: block; color: var(--muted); font-size: 13px; }
#modal .mf { padding: 12px 20px 16px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
#modal .mf .btn { margin-left: auto; }

/* ================= a tela (dentro do quadro) ================= */
.pf { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden; }
.pf * { box-sizing: border-box; }
.pf h1, .pf h2, .pf h3 { margin: 0; }
.pf .muted { color: var(--muted); }
.disp { font-family: var(--font-display); font-variant-numeric: tabular-nums; }

/* cabeçalho do console */
.sh { height: 56px; flex: none; display: flex; align-items: center; gap: 22px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 12; }
.sh-logo { display: flex; align-items: center; gap: 10px; flex: none; }
.sh-logo .ic { width: 32px; height: 32px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; color: var(--brand-ink); font-size: 15px; }
.sh-logo b { font-family: var(--font-display); font-size: 21px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; line-height: 1; display: block; }
.sh-logo small { display: block; font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.sh-nav { display: flex; gap: 2px; height: 100%; }
.sh-nav a { display: flex; align-items: center; padding: 0 12px; color: var(--ink-2); font-weight: 500; border-bottom: 3px solid transparent; cursor: pointer; transition: all .15s ease; }
.sh-nav a.on { color: var(--ink); border-bottom-color: var(--brand); font-weight: 700; }
.sh-nav a:hover { color: var(--ink); background: var(--surface-2); }
.sh-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.icbtn { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; position: relative; color: var(--ink-2); transition: all .15s ease; flex: none; }
.icbtn:hover { background: var(--surface-2); color: var(--ink); }
.icbtn .dot { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; font-weight: 700; border: 2px solid var(--surface); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 13px; cursor: pointer; flex: none; }
.sh-org { font-size: 12px; line-height: 1.2; }
.sh-org b { display: block; font-size: 13px; }
.sh-org span { color: var(--muted); }

/* barra da tela: título, vistas, busca, novo pedido */
.vb { height: 54px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 11; }
.vb h1 { font-family: var(--font-display); font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1; }
.vb .grow { flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex: none; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--ink-2); font-size: 13px; transition: all .15s ease; display: inline-flex; align-items: center; gap: 7px; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.seg button .n { font-size: 11px; background: var(--line); border-radius: 999px; padding: 0 6px; font-weight: 700; }
.seg button.on .n { background: var(--brand); color: var(--brand-ink); }
.busca { width: 300px; height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--muted); transition: border-color .15s ease; }
.busca:focus-within { border-color: var(--brand); }
.busca input { border: 0; background: transparent; outline: 0; flex: 1; min-width: 0; color: var(--ink); }
.kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ok); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; flex: none; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulso 1.6s infinite; }
@keyframes pulso { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes pulsoR { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--bad) 55%, transparent); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* corpo: trilho do menu + conteúdo */
.corpo { flex: 1; min-height: 0; display: flex; position: relative; }
.trilho { width: 56px; flex: none; background: var(--surface); border-right: 1px solid var(--line); position: relative; z-index: 10; }
.trilho .tin { position: absolute; top: 0; left: 0; bottom: 0; width: 56px; background: var(--surface); border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; transition: width .18s ease, box-shadow .18s ease; }
.trilho:hover .tin { width: 220px; box-shadow: var(--shadow-lg); }
.trilho a { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 11px; border-radius: 10px; color: var(--ink-2); cursor: pointer; white-space: nowrap; font-weight: 600; transition: background .15s ease; }
.trilho a i { width: 18px; text-align: center; font-size: 15px; flex: none; }
.trilho a:hover { background: var(--surface-2); color: var(--ink); }
.trilho a.on { background: var(--brand-soft); color: var(--brand-text); }
.trilho a span { opacity: 0; transition: opacity .12s ease; }
.trilho:hover a span { opacity: 1; }
.trilho .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.conteudo { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }

/* peças comuns */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; transition: all .15s ease; white-space: nowrap; flex: none; }
.btn.brand { background: var(--brand); color: var(--brand-ink); }
.btn.brand:hover { background: var(--brand-strong); }
.btn.ink { background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; white-space: nowrap; letter-spacing: .03em; text-transform: uppercase; flex: none; }
.b-ifood { background: var(--ifood); color: #fff; }
.b-rp { background: var(--ink); color: var(--bg); }
.pz { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.pz.g { background: var(--ok-soft); color: var(--ok); }
.pz.y { background: var(--warn-soft); color: var(--warn-text); }
.pz.r { background: var(--bad); color: #fff; }
.pz.n { background: var(--surface-2); color: var(--muted); }
.ofr { color: var(--bad); font-weight: 700; font-size: 12px; white-space: nowrap; }
.ofr span { font-variant-numeric: tabular-nums; }
.cap { width: 28px; height: 28px; flex: none; }
.ifs { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.ifs i { width: 7px; height: 7px; border-radius: 50%; }
.ifs.on i { background: var(--ok); } .ifs.rp i { background: var(--muted); }
.ifs.erro { color: var(--bad); } .ifs.erro i { background: var(--bad); animation: pulsoR 1.4s infinite; }
.vazio { padding: 28px 16px; text-align: center; color: var(--muted); }
.vazio i { display: block; font-size: 22px; color: var(--ok); margin-bottom: 6px; }
.sttag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.sttag img { width: 22px; height: 22px; }
.sttag.fim { color: var(--ok); } .sttag.canc { color: var(--muted); text-decoration: line-through; }

/* filtros por situação */
.flt { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
.flt button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap; transition: all .15s ease; display: inline-flex; gap: 6px; align-items: center; flex: none; }
.flt button b { font-family: var(--font-display); font-size: 15px; }
.flt button:hover { border-color: var(--brand); }
.flt button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.flt button.alerta { border-color: var(--bad); color: var(--bad); }
.flt button.alerta.on { background: var(--bad); color: #fff; }

/* linha de pedido (lista) */
.fr { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); cursor: pointer; transition: background .15s ease; }
.fr:hover { background: var(--surface-2); }
.fr.oferta { background: color-mix(in oklch, var(--bad-soft) 70%, transparent); }
.fr.atr { box-shadow: inset 3px 0 0 var(--bad); }
.fr.sel { background: var(--brand-soft); box-shadow: inset 3px 0 0 var(--brand); }
.fr-main { flex: 1; min-width: 0; }
.fr-l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.fr-l1 .muted { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fr.oferta { flex-wrap: wrap; row-gap: 2px; }
.fr.oferta .fr-st { order: 5; width: 100%; text-align: left; padding-left: 38px; }
.fr-l1 b { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.fr-l2 { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr-st { text-align: right; font-size: 13px; font-weight: 600; line-height: 1.25; flex: none; }
.fr-st small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }

/* cartão de pedido */
.fc { padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; transition: all .15s ease; }
.fc:hover { border-color: var(--brand); box-shadow: var(--shadow-sm); }
.fc.oferta { border-color: var(--bad); background: color-mix(in oklch, var(--bad-soft) 70%, var(--surface)); }
.fc.atr { border-color: var(--bad); }
.fc.sel { outline: 2px solid var(--brand); outline-offset: 1px; }
.fc.fim { opacity: .75; }
.fc-t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fc-t .muted { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fc-t b { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.fc-t .pz, .fc-t .btn, .fc-t .rt { margin-left: auto; }
.fc-t .rt { font-size: 12px; color: var(--muted); font-weight: 600; }
.fc-m { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.fc-m .cap { width: 22px; height: 22px; }
.fc-m span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.bar i.g { background: var(--ok); } .bar i.y { background: var(--warn); } .bar i.r { background: var(--bad); }

/* linha de motoboy */
.mr2 { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--line); cursor: pointer; transition: background .15s ease; }
.mr2:hover { background: var(--surface-2); }
.mr2.sel { background: var(--brand-soft); }
.mr2 .cap { width: 26px; height: 26px; }
.mr2 .mt { flex: 1; min-width: 0; }
.mr2 .mt b { display: block; font-weight: 700; }
.mr2 .mt small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mr2 .mc { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.2; flex: none; }
.mr2 .mc b { font-family: var(--font-display); font-size: 18px; color: var(--ink); display: block; }

/* detalhe do pedido */
.det { padding: 14px 16px; }
.det-h { display: flex; align-items: center; gap: 8px; }
.det-h b { font-family: var(--font-display); font-size: 26px; font-weight: 800; line-height: 1; }
.det-h .x { margin-left: auto; }
.det-rota { margin-top: 10px; display: grid; grid-template-columns: 18px 1fr; gap: 2px 10px; font-size: 13px; }
.det-rota i { color: var(--muted); text-align: center; margin-top: 3px; }
.det-rota .ln { width: 2px; background: var(--line); justify-self: center; height: 10px; }
.det-moto { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px; border-radius: 12px; background: var(--surface-2); }
.det-moto .cap { width: 32px; height: 32px; }
.det-moto div { flex: 1; min-width: 0; }
.det-moto small { display: block; color: var(--muted); font-size: 12px; }
.tl { margin-top: 12px; display: flex; flex-direction: column; gap: 0; }
.tl .st { display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; align-items: start; font-size: 13px; position: relative; padding-bottom: 8px; }
.tl .st:not(:last-child)::before { content: ''; position: absolute; left: 7px; top: 14px; bottom: -2px; width: 2px; background: var(--line); }
.tl .st.ok:not(:last-child)::before { background: var(--ok); }
.tl .st .bo { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); margin-top: 1px; position: relative; z-index: 1; }
.tl .st.ok .bo { background: var(--ok); border-color: var(--ok); }
.tl .st.agora .bo { border-color: var(--brand); background: var(--brand); animation: pulso 1.6s infinite; }
.tl .st span { color: var(--muted); font-variant-numeric: tabular-nums; }
.tl .st.pend { color: var(--muted); }
.det-acts { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

/* mapa */
.mapa { position: absolute; inset: 0; overflow: hidden; background: var(--map-land); }
.mapa svg.ruas { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapa.noite { --map-land: oklch(0.22 0.014 255); --map-road: oklch(0.33 0.02 255); --map-road-edge: oklch(0.18 0.012 255); --map-park: oklch(0.29 0.04 160); --map-water: oklch(0.28 0.05 235); }
.mk { position: absolute; transform: translate(-50%, -50%); cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: transform .15s ease, opacity .2s ease, left 1.8s linear, top 1.8s linear; z-index: 3; }
.mk:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 7; }
.mk img { width: 30px; height: 30px; filter: drop-shadow(0 2px 2px rgb(0 0 0 / 30%)); }
.mk .nm { font-size: 10px; font-weight: 700; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 0 5px; border-radius: 6px; margin-top: -3px; white-space: nowrap; }
.mk.loja { transform: translate(-50%, -100%); z-index: 2; }
.mk.loja:hover { transform: translate(-50%, -100%) scale(1.12); }
.mk.loja img { width: 30px; height: 36px; object-fit: contain; }
.mk.loja .nm { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mk.dest { transform: translate(-50%, -100%); color: var(--bad); font-size: 22px; z-index: 1; filter: drop-shadow(0 1px 1px rgb(0 0 0 / 30%)); }
.mk.dest:hover { transform: translate(-50%, -100%) scale(1.15); }
.mk.dest .rot { font-size: 10px; font-weight: 700; color: #fff; background: var(--ok); padding: 0 5px; border-radius: 6px; white-space: nowrap; margin-top: -2px; font-family: var(--font-body); display: inline-flex; gap: 4px; align-items: center; }
.mk.dest .rot.y { background: var(--warn); color: oklch(0.25 0.04 70); } .mk.dest .rot.r { background: oklch(0.5 0.19 27); }
.mk.dest.oferta i { animation: pulsoR 1.4s infinite; border-radius: 50%; }
.mk.sel { z-index: 9 !important; }
.mk.dest.sel { font-size: 32px; color: var(--brand-strong); }
.mk.moto.sel img { width: 40px; height: 40px; }
.mk.moto.sel .nm { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.mk.dim { opacity: .22; }
.mapa line.sel { stroke-width: 5 !important; opacity: 1 !important; stroke: var(--brand-strong) !important; stroke-dasharray: none !important; }

<script>
/* ======================= estado ======================= */
const S = {
  variant: 'a', screen: 1, vp: 1440, cen: 'normal', filtro: 'todos', sel: null, selMoto: null, q: '',
  painelPed: true, painelMoto: true, motoFiltro: 'todos',          // A (mapa)
  abaB: 'pedidos', cam: { motos: true, pedidos: true, lojas: true, rotas: true },   // B (mapa)
  abaT: 'andamento', visao: 'andamento', ord: { k: 'urg', dir: 1 }, marc: new Set(), pag: 1, lojaF: null,   // tabela
  fech: new Set(['concluido', 'cancelado']), exp: null,             // C (tabela)
  sheet: 'meio', mview: 'mapa', abaM: 'pedidos',                    // celular
};
const IMG = '../../../console/public/images/entregas/';
const HORA = 21 * 60 + 14;

const VARIANTS = {
  a: { nome: 'A: Painéis flutuantes', desc: '<b>A: Painéis flutuantes.</b> O mapa ocupa a tela inteira. Por cima dele flutuam: as contagens por situação no topo (clicáveis: filtram mapa e lista), o painel <b>Pedidos</b> à esquerda e o painel <b>Motoboys</b> à direita, os dois recolhíveis num botão. Clicar num pedido acende a rota no mapa e abre um cartão de detalhe embaixo. <b>Tabela:</b> abas por situação, ordenação por coluna, seleção com ações em massa e paginação. <b>Quadro:</b> uma coluna por situação (Sem motoboy, Indo à loja, A caminho, Concluídos). <b>Celular:</b> mapa com as contagens e a folha de baixo com Pedidos e Motoboys.' },
  b: { nome: 'B: Mapa + coluna à direita', desc: '<b>B: Mapa + coluna à direita.</b> O mapa fica à esquerda, com as <b>camadas</b> no topo (liga e desliga motoboys, pedidos, lojas e rotas) e uma faixa <b>Agora há pouco</b> embaixo, com os últimos eventos chegando ao vivo. À direita, uma coluna fixa com as abas Pedidos, Motoboys e Lojas; clicar num pedido troca a lista pelo detalhe. <b>Tabela:</b> visões salvas numa coluna à esquerda, filtros em chips e detalhe ao lado da tabela. <b>Quadro:</b> raias por loja × colunas por situação. <b>Celular:</b> mapa e folha com as três abas.' },
  c: { nome: 'C: Mapa imersivo', desc: '<b>C: Mapa imersivo.</b> Mapa noturno em tela cheia, como sala de controle. No topo, a faixa dos motoboys online (capacete + situação) e um placar com as contagens. Embaixo, os pedidos em cartões lado a lado, do mais urgente para o menos; escolher um cartão acende a rota no mapa e o cartão abre o detalhe. <b>Tabela:</b> agrupada por situação (grupos recolhíveis) e cada linha abre a linha do tempo do pedido. <b>Quadro:</b> uma coluna por motoboy, com "Sem motoboy" primeiro; <b>arraste o pedido até um motoboy livre para atribuir</b>. <b>Celular:</b> mapa, placar e os cartões deslizando na base.' },
};
const SCREENS = [[1, '1 · Mapa'], [2, '2 · Tabela'], [3, '3 · Quadro'], [4, '4 · Celular']];
const mob = () => S.screen === 4;
const pico = () => S.cen === 'pico';

/* ======================= dados ======================= */

function linhasTabela(aba) {
  let l = todos().filter(casaBusca);
  if (aba === 'andamento') l = l.filter(ativo);

  else if (aba === 'atrasado') l = l.filter(atrasado);
  else if (aba === 'concluido') l = l.filter(p => p.st === 'concluido');
  else if (aba === 'cancelado') l = l.filter(p => p.st === 'cancelado');
  else if (aba === 'semprazo') l = l.filter(p => ativo(p) && tomPz(p) !== 'g');
  if (S.lojaF) l = l.filter(p => p.loja === S.lojaF);
  const { k, dir } = S.ord;
  const val = p => k === 'urg' ? urg(p) : k === 'num' ? p.num : k === 'loja' ? LOJAS[p.loja].curto : k === 'moto' ? (p.moto || '~') : k === 'criado' ? p.min : k === 'km' ? (p.km || 0) : k === 'cliente' ? p.cliente : urg(p);
  return l.sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
}
function barraMassa() {

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* atribuir: motoboys livres por distância até a loja, desempate por menos corridas hoje */
function abrirAtribuir(id) {
  const p = achar(id); if (!p) return;
  const l = LOJAS[p.loja];
  const livres = motosOnline().filter(m => m.st === 'livre' && m.nome !== p.moto).map(m => ({ ...m, km: Math.hypot(m.x - l.x, (m.y - l.y) * .7) / 9 }))
    .sort((a, b) => Math.abs(a.km - b.km) < .3 ? a.corridas - b.corridas : a.km - b.km);
  const md = document.getElementById('modal');
  md.innerHTML = `<div class="box">
    <div class="mh"><h2>${p.moto ? 'Trocar motoboy' : 'Atribuir'} ${numTxt(p)}</h2><p>${l.nome} → ${p.cliente}, ${p.bairro}</p></div>
    <div class="ml">${livres.length ? livres.map(m => `<div class="mr"><img src="${capSrc('livre')}" alt=""><div><b>${m.nome}</b><small>${m.km.toFixed(1).replace('.', ',')} km da loja · ${m.corridas} corridas hoje</small></div><button class="btn sm brand" data-act="enviar" data-id="${p.id}" data-m="${m.nome}">Enviar</button></div>`).join('') : '<div class="mr"><div>Nenhum motoboy livre agora.<small>A distribuição segue oferecendo aos que forem ficando livres.</small></div></div>'}</div>
    <div class="mf"><i class="fa-solid fa-circle-info"></i> ${p.st === 'oferta' ? 'A distribuição continua oferecendo até você escolher.' : 'O motoboy atual recebe o aviso de que saiu do pedido.'}<button class="btn sm ghost" data-act="fechar">Cancelar</button></div>
  </div>`;
  md.classList.add('show');
}
function atribuir(id, nome) {
  const p = achar(id);
  const pos = sc().livresPos[nome] || motosOnline().find(m => m.nome === nome) && [motosOnline().find(m => m.nome === nome).x, motosOnline().find(m => m.nome === nome).y] || [50, 50];
  Object.assign(p, { st: p.st === 'oferta' ? 'loja' : p.st, moto: nome, mx: pos[0], my: pos[1] });
  toast(`Pedido ${numTxt(p)} enviado para ${nome}`);
  render();
}

/* arrastar no quadro da C */
function ligarArrastar() {
  document.querySelectorAll('#stage .fc[draggable=true]').forEach(el => {
    el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', el.dataset.id); el.classList.add('arrastando'); });
    el.addEventListener('dragend', () => el.classList.remove('arrastando'));
  });
  document.querySelectorAll('#stage [data-drop]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('alvo'); });
    col.addEventListener('dragleave', () => col.classList.remove('alvo'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('alvo');
      const id = e.dataTransfer.getData('text/plain'), nome = col.dataset.drop, p = achar(id);
      if (!p || nome === 'nenhum' || p.moto === nome) return;
      const m = motosOnline().find(x => x.nome === nome);
      if (m.st !== 'livre') { toast(`${nome} está ${m.st === 'loja' ? 'indo à loja' : 'em entrega'}: o pedido entra como "entrega junto" (pede confirmação)`); }
      atribuir(id, nome);
    });
  });
}

document.addEventListener('click', (e) => {
  const vt = e.target.closest('#vtabs [data-v]');
  if (vt) { S.variant = vt.dataset.v; render(); return; }
  const st = e.target.closest('#stabs [data-s]');
  if (st) { S.screen = +st.dataset.s; S.sel = null; S.selMoto = null; S.marc.clear(); render(); return; }
  const ct = e.target.closest('#ctabs [data-c]');
  if (ct) { S.cen = ct.dataset.c; S.sel = null; S.selMoto = null; S.filtro = 'todos'; render(); return; }
  if (e.target.id === 'modal') { e.target.classList.remove('show'); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'busca') return;
  if (act === 'filtro') { e.stopPropagation(); S.filtro = S.filtro === v && v !== 'todos' ? 'todos' : v; S.sel = null; render(); return; }
  if (act === 'atribuir') { e.stopPropagation(); abrirAtribuir(el.dataset.id); return; }
  if (act === 'fechar') { document.getElementById('modal').classList.remove('show'); return; }
  if (act === 'enviar') { document.getElementById('modal').classList.remove('show'); atribuir(el.dataset.id, el.dataset.m); return; }
  if (act === 'sel') { S.sel = S.sel === el.dataset.id ? null : el.dataset.id; S.selMoto = null; if (mob() && S.sel && S.sheet === 'baixo') S.sheet = 'meio'; render(); return; }
  if (act === 'desel') { e.stopPropagation(); S.sel = null; render(); return; }
  if (act === 'abrir') { S.sel = el.dataset.id; toast(`Abre o pedido ${numTxt(achar(el.dataset.id))} (detalhe do sketch 007)`); return; }
  if (act === 'moto') { S.selMoto = S.selMoto === el.dataset.n ? null : el.dataset.n; S.sel = null; render(); return; }
  if (act === 'painel') { S[v] = !S[v]; render(); return; }
  if (act === 'motofiltro') { S.motoFiltro = S.motoFiltro === v && v !== 'todos' ? 'todos' : v; S.painelMoto = true; render(); return; }
  if (act === 'cam') { S.cam[v] = !S.cam[v]; render(); return; }
  if (act === 'abaB') { S.abaB = v; render(); return; }
  if (act === 'abaM') { S.abaM = v; render(); return; }
  if (act === 'abaT') { S.abaT = v; S.pag = 1; S.marc.clear(); render(); return; }
  if (act === 'visao') { S.visao = v; S.pag = 1; S.sel = null; render(); return; }
  if (act === 'vista') { S.screen = +el.dataset.s; if (el.dataset.aba) { S.abaT = el.dataset.aba; S.visao = el.dataset.aba; } S.sel = null; S.marc.clear(); render(); return; }
  if (act === 'mview') { S.mview = v; render(); return; }
  if (act === 'sheet') { S.sheet = { baixo: 'meio', meio: 'alto', alto: 'baixo' }[S.sheet]; render(); return; }
  if (act === 'ord') { const k = el.dataset.k; S.ord = { k, dir: S.ord.k === k ? -S.ord.dir : 1 }; render(); return; }
  if (act === 'pag') { S.pag = +v; render(); return; }
  if (act === 'marc') { e.stopPropagation(); const id = el.dataset.id; S.marc.has(id) ? S.marc.delete(id) : S.marc.add(id); render(); return; }
  if (act === 'marctodos') { e.stopPropagation(); const ids = [...document.querySelectorAll('#stage input[data-act="marc"]')].map(i => i.dataset.id); const all = ids.every(i => S.marc.has(i)); ids.forEach(i => all ? S.marc.delete(i) : S.marc.add(i)); render(); return; }
  if (act === 'limpamarc') { S.marc.clear(); render(); return; }
  if (act === 'lojaF') { const ks = Object.keys(LOJAS); S.lojaF = S.lojaF ? null : ks[0]; S.pag = 1; toast(S.lojaF ? 'Filtro: Terraço Pizza Bar (no real, abre a lista de lojas)' : 'Filtro de loja removido'); render(); return; }
  if (act === 'grupo') { S.fech.has(v) ? S.fech.delete(v) : S.fech.add(v); render(); return; }
  if (act === 'grupos') { if (v === 'abrir') S.fech.clear(); else ['oferta', 'atrasado', 'loja', 'rota', 'concluido', 'cancelado'].forEach(k => S.fech.add(k)); render(); return; }
  if (act === 'exp') { S.exp = S.exp === el.dataset.id ? null : el.dataset.id; render(); return; }
  if (act === 'rolar') { const t = document.getElementById('trilhoC'); if (t) t.scrollLeft += (+v) * 560; return; }
  if (act === 'nav') { toast(el.dataset.n === 'Pedidos' || el.dataset.n === 'Operações' ? 'Você já está em Pedidos' : 'Abre ' + el.dataset.n); return; }
  if (act === 'toast') { toast(el.dataset.msg); return; }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.act === 'busca') { S.q = e.target.value; S.pag = 1; render(); }
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const i = document.querySelector('#stage [data-act="busca"]'); if (i) i.focus(); }
  if (e.key === 'Escape') { document.getElementById('modal').classList.remove('show'); if (S.sel || S.selMoto) { S.sel = null; S.selMoto = null; render(); } }
});

/* relógio das ofertas (rodadas de 50 s) */
setInterval(() => {
  Object.values(CEN).forEach(c => c.pedidos.filter(p => p.st === 'oferta').forEach(p => {
    p.cd--;
    if (p.cd < 0) { p.cd = 50; p.rodada = p.rodada >= 3 ? 1 : p.rodada + 1; }
    document.querySelectorAll(`[data-cd="${p.id}"]`).forEach(s => s.textContent = mmss(p.cd));
    document.querySelectorAll(`[data-rd="${p.id}"]`).forEach(s => s.textContent = p.rodada);
  }));
}, 1000);

/* motoboys andando: a cada 2 s, um passo na direção da loja (indo à loja) ou do cliente (a caminho) */
setInterval(() => {
  if (document.hidden) return;
  sc().pedidos.forEach(p => {
    if (p.st !== 'loja' && p.st !== 'rota') return;
    const alvo = p.st === 'rota' ? [p.dx, p.dy] : [LOJAS[p.loja].x, LOJAS[p.loja].y];
    const dx = alvo[0] - p.mx, dy = alvo[1] - p.my, d = Math.hypot(dx, dy);
    if (d < 1.5) return;
    p.mx += dx / d * 0.6; p.my += dy / d * 0.6;
  });
  motosOnline().forEach(m => {
    document.querySelectorAll(`#stage .mk.moto[data-m="${m.nome}"]`).forEach(el => { el.style.left = m.x + '%'; el.style.top = m.y + '%'; });
    if (m.ped) document.querySelectorAll(`#stage line[data-l="${m.ped.id}"]`).forEach(ln => { ln.setAttribute('x1', m.ped.mx); ln.setAttribute('y1', m.ped.my); });
  });
}, 2000);

/* B: um evento novo a cada 9 s na faixa "Agora há pouco" */
let evI = 0, evMin = HORA;
setInterval(() => {
  if (document.hidden) return;
  evMin++;
  const ev = EVENTOS_POOL[evI++ % EVENTOS_POOL.length];
  EVENTOS = [[`${Math.floor(evMin / 60)}:${String(evMin % 60).padStart(2, '0')}`, ...ev], ...EVENTOS].slice(0, 8);
  EVENTOS.novo = true;
  const alvo = document.querySelector('#stage .evB .evs');
  if (alvo) alvo.innerHTML = EVENTOS.slice(0, 6).map(([h, ic, cor, t], i) => `<span class="ev ${i === 0 ? 'novo' : ''}" data-act="toast" data-msg="${t}"><span>${h}</span><i class="fa-solid ${ic}" style="color:${cor}"></i>${t}</span>`).join('');
  EVENTOS.novo = false;
}, 9000);

document.getElementById('theme-switcher').addEventListener('change', (e) => {
  document.getElementById('theme').href = '../themes/' + e.target.value + '.css';
  document.body.classList.toggle('dark-chrome', e.target.value !== 'entregas');
});
document.querySelectorAll('#sketch-tools [data-vp]').forEach(b => b.addEventListener('click', () => {
  S.vp = +b.dataset.vp; document.querySelectorAll('#sketch-tools [data-vp]').forEach(x => x.classList.toggle('on', x === b)); render();
}));
document.getElementById('annot-btn').addEventListener('click', (e) => { document.body.classList.toggle('annot'); e.target.classList.toggle('on'); });
window.addEventListener('resize', render);
render();
</script>
