<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 009: portal da loja unificado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link id="theme" rel="stylesheet" href="../themes/entregas.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #e7e2da; font-family: system-ui, sans-serif; color: #1c1917; }
body.dark-chrome { background: #0c0a09; }
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- moldura do sketch (fora da tela) ---------- */
#chrome { position: sticky; top: 0; z-index: 50; background: #1c1917; color: #e7e5e4; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
#chrome .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#chrome .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a8a29e; margin-right: 6px; font-weight: 700; min-width: 56px; }
.chip { border: 1px solid #44403c; background: #292524; color: #e7e5e4; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; transition: all .15s ease; flex: none; }
.chip:hover { border-color: #fb923c; }
.chip.on { background: #ea7a1a; border-color: #ea7a1a; color: #1c1917; font-weight: 600; }
.chip.cmp { border-style: dashed; }
.chip.cmp.on { border-style: solid; }
#desc { font-size: 13px; color: #d6d3d1; max-width: 1250px; line-height: 1.45; }
#desc b { color: #fff; }
#stage { padding: 16px 24px 60px; }
.single { display: flex; justify-content: center; }
.cmpgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
.cmpcol h3 { margin: 0 0 8px; font-size: 14px; color: #1c1917; }
body.dark-chrome .cmpcol h3 { color: #e7e5e4; }
.frame { width: max-content; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 40px rgb(28 25 23 / 25%); }
.frame.phone { border-radius: 34px; border: 10px solid #1c1917; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1c1917; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all .2s ease; z-index: 300; pointer-events: none; max-width: 90vw; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui; font-size: 12px; background: rgba(0,0,0,.75); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: .45; transition: opacity .2s; display: flex; gap: 8px; align-items: center; }
#sketch-tools:hover { opacity: 1; }
#sketch-tools select, #sketch-tools button { background: #292524; color: #fff; border: 1px solid #44403c; border-radius: 6px; padding: 3px 6px; cursor: pointer; font-size: 12px; }

/* ---------- app (dentro da tela) ---------- */
.app { position: relative; background: oklch(0.93 0.02 75); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
[data-theme-dark] .app { background: oklch(0.14 0.01 60); }
.app.desk { width: 1366px; height: 768px; display: grid; }
.app.desk.va { grid-template-rows: 52px 1fr; grid-template-columns: 64px 1fr; }
.app.desk.vb, .app.desk.vc { grid-template-rows: 56px 1fr; grid-template-columns: 1fr; }
.app.phone { width: 390px; height: 800px; background: var(--bg); }
.app b, .app strong { font-weight: 700; }
.disp { font-family: var(--font-display); }
.muted { color: var(--muted); }
.app button, .app a { cursor: pointer; transition: all .15s ease; }
.app a { text-decoration: none; color: inherit; }
.sheet { position: relative; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.va .sheet { border-radius: 14px 0 0 0; }
.vb .sheet, .vc .sheet { border-radius: 14px 14px 0 0; margin: 0 8px; }

/* cabeçalho */
.ch { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 12px; position: relative; z-index: 40; }
.logo { display: flex; align-items: center; gap: 9px; min-width: 0; }
.logo .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; flex: none; }
.logo b { font-family: var(--font-display); font-size: 1.25rem; line-height: 1; display: block; white-space: nowrap; }
.logo small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.seg { display: flex; background: oklch(0.88 0.025 72); border-radius: 10px; padding: 3px; gap: 2px; }
[data-theme-dark] .seg { background: oklch(0.22 0.012 60); }
.seg a { padding: 6px 13px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.seg a:hover { color: var(--ink); }
.seg a.on { background: var(--brand); color: var(--brand-ink); box-shadow: var(--shadow-sm); }
.seg.claro a.on { background: var(--surface); color: var(--ink); }
.ch .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.busca { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 34px; width: 280px; color: var(--muted); }
.busca input { border: 0; background: transparent; outline: 0; flex: 1; min-width: 0; color: var(--ink); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-ink); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 0; flex: none; }
.dd-wrap { position: relative; }
.dd { position: absolute; top: 42px; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; width: 240px; display: flex; flex-direction: column; z-index: 60; animation: sobe .15s ease; }
.dd .dd-cab { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.dd .dd-cab small { display: block; color: var(--muted); font-size: 12px; }
.dd button { border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font-weight: 600; }
.dd button:hover { background: var(--surface-2); }
.dd button.perigo { color: var(--bad); }
.contador { position: absolute; top: -5px; right: -5px; background: var(--bad); color: #fff; border-radius: 999px; font-size: 10.5px; font-weight: 800; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; border: 2px solid oklch(0.93 0.02 75); }

/* A: trilho de ícones que abre por cima */
.rail { position: relative; z-index: 30; }
.rail-in { position: absolute; top: 0; left: 0; bottom: 0; width: 64px; padding: 6px 13px; display: flex; flex-direction: column; gap: 6px; background: oklch(0.93 0.02 75); transition: width .18s ease, box-shadow .18s ease; overflow: hidden; border-radius: 0 14px 14px 0; }
[data-theme-dark] .rail-in { background: oklch(0.14 0.01 60); }
.rail:hover .rail-in { width: 230px; box-shadow: var(--shadow-lg); }
.rail .tit { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 2px 2px; white-space: nowrap; opacity: 0; transition: opacity .15s; height: 22px; }
.rail:hover .tit { opacity: 1; }
.rail a { display: flex; align-items: center; gap: 11px; border-radius: 10px; white-space: nowrap; font-weight: 600; color: var(--ink-2); position: relative; }
.rail a .q { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: oklch(0.89 0.025 72); flex: none; position: relative; }
[data-theme-dark] .rail a .q { background: oklch(0.22 0.012 60); }
.rail a:hover .q { filter: brightness(.96); }
.rail a.on .q { background: var(--brand); color: var(--brand-ink); }
.rail a.tinta .q { background: var(--ink); color: var(--bg); }
.rail a.on { color: var(--ink); }
.rail a .contador { border-color: oklch(0.89 0.025 72); }

/* B: gaveta "Marca da loja" */
.gv-fundo { position: absolute; inset: 0; background: oklch(0.2 0.02 60 / 40%); backdrop-filter: blur(2px); z-index: 70; animation: aparece .18s ease; }
.gv { position: absolute; top: 0; left: 0; bottom: 0; width: 330px; background: var(--surface); z-index: 71; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: entraEsq .2s ease; overflow: auto; }
.phone .gv { width: 86%; }
@keyframes entraEsq { from { transform: translateX(-30px); opacity: 0; } }
.gv-topo { background: var(--brand); color: var(--brand-ink); padding: 16px 16px 18px; position: relative; }
.gv-topo .x { position: absolute; top: 12px; right: 12px; background: oklch(1 0 0 / 30%); border: 0; color: var(--brand-ink); }
.gv-topo .ini { width: 48px; height: 48px; border-radius: 14px; background: var(--brand-ink); color: var(--brand); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; margin-bottom: 10px; }
.gv-topo b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.05; display: block; }
.gv-topo small { font-size: 12.5px; opacity: .85; }
.gv-resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px 14px 4px; }
.gv-resumo div { background: var(--surface-2); border-radius: 10px; padding: 8px; text-align: center; }
.gv-resumo b { font-family: var(--font-display); font-size: 1.5rem; display: block; line-height: 1; }
.gv-resumo small { font-size: 11px; color: var(--muted); line-height: 1.1; display: block; margin-top: 3px; }
.gv-novo { margin: 10px 14px 6px; }
.gv-menu { padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.gv-menu a { display: flex; align-items: center; gap: 12px; padding: 8px 8px; border-radius: 10px; font-weight: 600; }
.gv-menu a:hover { background: var(--surface-2); }
.gv-menu a.on { background: var(--brand-soft); }
.gv-menu .circ { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.gv-menu .n { margin-left: auto; background: var(--surface-2); border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 700; }
.gv-pe { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.gv-pe .linha { display: flex; align-items: center; gap: 10px; }
.toggle { width: 40px; height: 22px; border-radius: 999px; background: var(--line); border: 0; position: relative; padding: 0; margin-left: auto; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s ease; }
.toggle.on { background: var(--brand); }
.toggle.on::after { left: 21px; }

/* botões e selos */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 13px; display: inline-flex; gap: 7px; align-items: center; justify-content: center; white-space: nowrap; }
.btn:hover { border-color: var(--brand); }
.btn.marca { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.marca:hover { background: var(--brand-strong); }
.btn.tinta { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.perigo { color: var(--bad); }
.btn.perigo.cheio { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.peq { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.btn.grande { padding: 11px 16px; font-size: 14.5px; border-radius: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icbtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; color: var(--ink-2); position: relative; flex: none; }
.icbtn:hover { border-color: var(--brand); color: var(--ink); }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-ifood { background: var(--ifood); color: #fff; }
.b-rp { background: var(--brand); color: var(--brand-ink); }
.b-portal { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.s-oferta { background: var(--bad-soft); color: var(--bad); }
.s-loja { background: var(--warn-soft); color: var(--warn-text); }
.s-rota { background: var(--brand-soft); color: var(--brand-text); }
.s-concluido { background: var(--ok-soft); color: var(--ok); }
.s-cancelado { background: var(--surface-2); color: var(--muted); }
.pz { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pz.g { background: var(--ok-soft); color: var(--ok); }
.pz.y { background: var(--warn-soft); color: var(--warn-text); }
.pz.r { background: var(--bad); color: #fff; }
.pz.n { background: var(--surface-2); color: var(--muted); }
.selo { display: inline-flex; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 700; white-space: nowrap; margin-right: 4px; }
.selo.azul { background: oklch(0.93 0.04 250); color: oklch(0.42 0.13 255); }
.selo.amar { background: var(--warn-soft); color: var(--warn-text); }
[data-theme-dark] .selo.azul { background: oklch(0.3 0.06 255); color: oklch(0.85 0.08 250); }
.f-paga { background: var(--ok-soft); color: var(--ok); }
.f-aberta { background: var(--brand-soft); color: var(--brand-text); }
.f-parcial { background: var(--warn-soft); color: var(--warn-text); }
.f-vencida { background: var(--bad); color: #fff; }
.f-cancelada { background: var(--surface-2); color: var(--muted); text-decoration: line-through; }
input.campo, select.campo, textarea.campo { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; outline: 0; transition: border-color .15s ease; }
input.campo:focus, select.campo:focus, textarea.campo:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
input.campo.erro { border-color: var(--bad); }
input.campo[readonly] { background: var(--surface-2); color: var(--muted); }
label.rot { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 5px; }
.erro-txt { color: var(--bad); font-size: 12.5px; font-weight: 600; margin-top: 4px; }

/* ---------- mapa falso ---------- */
.mapa { position: absolute; inset: 0; background: var(--map-land); overflow: hidden; }
.mapa .ruas { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapa.marcar { cursor: crosshair; }
.mk { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; transition: opacity .2s ease; cursor: pointer; }
.mk.dim { opacity: .2; }
.mk.loja img { width: 30px; }
.mk.moto img { width: 30px; transform: translateY(50%); }
.mk.moto { transform: translate(-50%, -50%); }
.mk .nm { font-size: 11px; font-weight: 700; background: var(--surface); padding: 1px 6px; border-radius: 6px; box-shadow: var(--shadow-sm); margin-top: 2px; white-space: nowrap; }
.mk.moto .nm { margin-top: 16px; }
.mk.dest i { font-size: 26px; color: var(--bad); filter: drop-shadow(0 2px 2px rgb(0 0 0 / 25%)); }
.mk.pd .pin { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: grid; place-items: center; color: #fff; font-weight: 800; box-shadow: var(--shadow-md); border: 2px solid #fff; }
.mk.pd .pin span { transform: rotate(45deg); font-family: var(--font-display); font-size: 15px; }
.mk.pd.p .pin { background: var(--brand-strong); }
.mk.pd.d .pin { background: var(--bad); }
.mk.pd.d.novo { animation: pula .35s ease; }
@keyframes pula { 0% { transform: translate(-50%, -160%); } 100% { transform: translate(-50%, -100%); } }
.mk .rot { font-size: 11px; font-weight: 700; background: var(--ok); color: #fff; padding: 1px 6px; border-radius: 6px; margin-top: 2px; white-space: nowrap; }
.mk .rot.y { background: var(--warn); color: oklch(0.25 0.05 70); }
.mk .rot.r { background: var(--bad); }
.mk .rot.n { background: oklch(0.55 0.03 255); }
.mapa .eta { position: absolute; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; transform: translate(-50%, -50%); white-space: nowrap; box-shadow: var(--shadow-md); }
.rota-leg { position: absolute; bottom: 12px; z-index: 3; background: var(--surface); border-radius: 10px; padding: 6px 10px; box-shadow: var(--shadow-md); display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.mctl { position: absolute; bottom: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
.mctl button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }

/* ---------- tela de pedidos ---------- */
.barra { flex: none; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
.barra h1 { font-family: var(--font-display); font-size: 1.75rem; margin: 0; line-height: 1; }
.aovivo-sel { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ok); }
.aovivo-sel::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.barra .sp { flex: 1; }
.area { position: relative; flex: 1; min-height: 0; isolation: isolate; }
.ov { position: absolute; z-index: 4; }
.contagens { top: 12px; display: flex; gap: 6px; }
.cont { background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-md); display: flex; gap: 6px; align-items: center; border: 1.5px solid transparent; }
.cont b { font-family: var(--font-display); font-size: 1.1rem; }
.cont.alerta b { color: var(--bad); }
.cont.on { border-color: var(--brand); background: var(--brand-soft); }
.cont:hover { border-color: var(--line); }
.painel { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
.ph { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); flex: none; }
.ph b { font-family: var(--font-display); font-size: 1.2rem; }
.ph .n { background: var(--surface-2); border-radius: 999px; padding: 0 8px; font-weight: 700; font-size: 12px; }
.lista { overflow: auto; flex: 1; }
.lp { display: flex; flex-direction: column; gap: 3px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s ease; }
.lp:hover { background: var(--surface-2); }
.lp.sel { background: var(--brand-soft); box-shadow: inset 3px 0 0 var(--brand); }
.lp .l1 { display: flex; gap: 6px; align-items: center; }
.lp .l1 b { font-family: var(--font-display); font-size: 1.2rem; }
.lp .l1 .sp { flex: 1; }
.lp .l2 { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.lp .l2 img { width: 16px; }
.lp.fim { opacity: .7; }
.grupo-tit { padding: 8px 14px 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--line); }
.mr { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 13px; }
.mr img { width: 22px; }
.mr small { color: var(--muted); display: block; font-size: 11.5px; }
.mr .tag { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--brand-text); }
.voltar-pill { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; box-shadow: var(--shadow-lg); display: flex; gap: 8px; align-items: center; }
.col-lista { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.filtros { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: none; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
.fchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- folha do pedido aberto e do novo pedido ---------- */
.fo { display: flex; flex-direction: column; overflow: hidden; }
.fo-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; flex: none; }
.fo-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.fo-top .num { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; line-height: 1; }
.fo-top .x { margin-left: auto; }
.fo-para { font-size: 14px; color: var(--ink-2); }
.fo-para b { color: var(--ink); }
.fo-corpo { overflow: auto; flex: 1; padding: 12px 14px 18px; }
.fo-voltar { border: 0; background: transparent; color: var(--brand-text); font-weight: 700; font-size: 13px; padding: 0; display: inline-flex; gap: 6px; align-items: center; align-self: flex-start; }
.cm { display: flex; flex-direction: column; gap: 12px; }

  }

    ${[8, 35, 66, 92].map(y => rua(`M0,${y} L100,${y}`, 3)).join('')}${[10, 35, 62, 88].map(x => rua(`M${x},0 L${x},100`, 3)).join('')}
    ${[20, 50, 80].map(y => rua(`M0,${y} L100,${y}`, 6)).join('')}${[22, 48, 74].map(x => rua(`M${x},0 L${x},100`, 6)).join('')}
    ${rua('M0,98 L100,8', 9)}${linhas}</svg>`;
  let mk = '';

      mk += `<div class="mk moto" style="left:${tx(m.x)}%;top:${ty(m.y)}%"><img src="${capSrc(m.st)}" alt=""><span class="nm" style="background:oklch(0.55 0.15 255);color:#fff">${m.nome}</span></div>`;
      mk += `<div class="eta" style="left:${tx(m.x)}%;top:${ty(m.y) - 9}%">${foco.st === 'rota' ? 'chega em ' + foco.min + ' min' : 'na loja em ~5 min'}</div>`;

  } else {

    ativos().forEach(p => {
      const m = D.motos.find(x => x.ped === p.id);
      const rot = m && opts.rotulos !== false ? `<span class="rot ${tomPz(p) === 'g' ? '' : tomPz(p)}">${p.st === 'rota' ? '<i class="fa-solid fa-motorcycle"></i> ' : ''}${numTxt(p)} · ${m.nome}</span>` : '';

    D.motos.forEach(x => {
      const p = x.ped && ped(x.ped);

const zoomCtl = (esq = 12) => `<div class="mctl" style="left:${esq}px"><button data-act="toast" data-msg="Aproxima"><i class="fa-solid fa-plus"></i></button><button data-act="toast" data-msg="Afasta"><i class="fa-solid fa-minus"></i></button></div>`;

/* ======================= peças do pedido ======================= */
function cardPedido(p, cls = 'lp') {
  const m = D.motos.find(x => x.ped === p.id);
  const motoTxt = p.st === 'oferta' ? `<i class="fa-solid fa-tower-broadcast" style="color:var(--bad)"></i> procurando motoboy` : p.moto ? `<img src="${capSrc(ativo(p) ? p.st : 'x')}" alt="">${p.moto}` : `<i class="fa-solid fa-ban"></i> cancelado`;
  return `<div class="${cls} ${S.ped === p.id && [3].includes(S.tela) ? 'sel' : ''} ${ativo(p) ? '' : 'fim'}" data-act="abrir" data-id="${p.id}">
    <div class="l1"><b>${numTxt(p)}</b>${origem(p)}<span class="sp" style="flex:1"></span>${sit(p)}</div>
    <div class="l2">${motoTxt} · ${nome(p) || 'Cliente'} · ${p.criado} ${pz(p)}</div></div>`;
}
// ordem da lista: quem vence o prazo de entrega primeiro fica em cima (os atrasados no topo, o mais atrasado antes);
// sem prazo vai para o fim, o mais antigo antes
const porPrazo = (a, b) => (a.prazo == null) - (b.prazo == null) || (a.prazo ?? 0) - (b.prazo ?? 0) || a.criado.localeCompare(b.criado);
function listaPedidos(cls) {
  const at = ativos().sort(porPrazo), fim = D.pedidos.filter(p => !ativo(p));
  const filtrados = S.filtro ? at.filter(p => S.filtro === 'atrasado' ? p.prazo != null && p.prazo < 0 : p.st === S.filtro) : at;
  return `${filtrados.map(p => cardPedido(p, cls)).join('') || '<div class="muted" style="padding:16px;text-align:center">Nenhum pedido nesse filtro</div>'}
    <div class="grupo-tit">Encerrados hoje</div>${fim.map(p => cardPedido(p, cls)).join('')}`;
}
function contagens(extra = '') {
  const at = ativos();
  const c = [['oferta', at.filter(p => p.st === 'oferta').length, 'sem motoboy', 1], ['atrasado', at.filter(p => p.prazo != null && p.prazo < 0).length, 'atrasado', 1], ['loja', at.filter(p => p.st === 'loja').length, 'indo à loja'], ['rota', at.filter(p => p.st === 'rota').length, 'a caminho'], ['livre', D.motos.filter(m => m.st === 'livre').length, 'motoboys livres']];
  return `<div class="ov contagens" style="${extra}">${c.map(([k, n, t, al]) => `<button class="cont ${al && n ? 'alerta' : ''} ${S.filtro === k ? 'on' : ''}" data-act="filtro" data-k="${k}"><b>${n}</b> ${t}</button>`).join('')}</div>`;
}
function painelMotos(estilo) {
  if (!S.motosAberto) return `<button class="ov btn" style="${estilo};box-shadow:var(--shadow-md)" data-act="motos"><i class="fa-solid fa-helmet-safety"></i> Motoboys <b>${D.motos.length}</b></button>`;
  const meus = D.motos.filter(m => m.ped), outros = D.motos.filter(m => !m.ped);
  return `<div class="ov painel" style="${estilo};width:230px">
    <div class="ph"><b>Motoboys</b><span class="n">${D.motos.length} online</span><button class="icbtn" style="margin-left:auto;width:28px;height:28px" data-act="motos" title="Recolher"><i class="fa-solid fa-angles-left"></i></button></div>
    <div class="lista" style="max-height:380px">${meus.map(m => `<div class="mr" data-act="abrir" data-id="${m.ped}" style="cursor:pointer"><img src="${capSrc(m.st)}" alt=""><div><b>${m.nome}</b><small>${numTxt(ped(m.ped))} · ${SIT[m.st].toLowerCase()}</small></div><span class="tag">seu</span></div>`).join('')}
    ${outros.map(m => `<div class="mr"><img src="${capSrc(m.st)}" alt=""><div><b>${m.nome}</b><small>${m.st === 'livre' ? 'livre' : 'em outra entrega'}</small></div></div>`).join('')}</div></div>`;
}
function secMotoboy(p) {
  if (p.st === 'cancelado') return `<div class="cm-sec"><div class="cm-l"><i class="fa-solid fa-ban"></i><div class="grow"><b>Pedido cancelado</b><small>Cancelado pelo iFood às 18:09 · não cobrado</small></div></div></div>`;
  if (p.st === 'oferta') {
    return `<div class="cm-oferta">
      <div style="display:flex;gap:8px;align-items:center"><i class="fa-solid fa-tower-broadcast"></i><span>Procurando motoboy · rodada <span data-rod>${p.rodada}</span>/3</span><span style="margin-left:auto;font-family:var(--font-display);font-size:1.2rem" data-cd>${mmss(p.cd)}</span></div>

      <small>Os motoboys perto da loja estão recebendo o pedido. Você pode cancelar até alguém aceitar.</small>

function secCobra(p) {

function secCliente(p) {

function secCupom(p) {

    ${p.itens.map(i => `<div class="pr"><span class="q">${i.q}×</span><div><b>${i.n}</b>${i.op ? `<small>${i.op}</small>` : ''}${i.ob ? `<span class="ob">Obs.: ${i.ob}</span>` : ''}</div></div>`).join('')}</div>`;

      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn peq" data-act="toast" data-msg="Link de rastreio copiado: entregas.restaurantepro.com.br/~/track-order"><i class="fa-solid fa-link"></i> Copiar link de rastreio</button></div>

/* ======================= interação ======================= */
function ir(t) {
  S.tela = t; S.dd = false; S.gaveta = false; S.cel.menu = false; S.cancel = false;
  if (t === 2 || t === 4) S.de = null;
  if (t === 6) { S.cvAberta = S.v === 'a' || S.cvAberta; }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.dd && !e.target.closest('.dd')) { S.dd = false; render(); } return; }
  const a = el.dataset.act;
  if (a === 'nada') return;
  switch (a) {
    case 'v': S.v = el.dataset.k; break;
    case 'tela': ir(+el.dataset.k); if (S.tela === 3 && !S.ped) S.ped = 'p1'; break;
    case 'ir': ir(+el.dataset.t); break;
    case 'abrir': S.ped = el.dataset.id; S.mais = false; S.cancel = false; S.de = S.tela === 1 ? 'inicio' : null; S.tela = 3; S.dd = false; S.gaveta = false; break;
    case 'abrir-tabela': S.ped = el.dataset.id; S.mais = false; S.cancel = false; S.de = 'tabela'; S.tela = 3; break;
    case 'fechar': S.tela = 2; S.de = null; break;
    case 'mais': S.mais = !S.mais; break;
    case 'cancelar': S.cancel = true; break;
    case 'cancelar-nao': S.cancel = false; break;
    case 'cancelar-ok': { const p = ped(S.ped); p.st = 'cancelado'; p.tl = [p.tl[0], ['Cancelado pela loja', '19:36']]; S.cancel = false; toast(`Pedido ${numTxt(p)} cancelado. Saiu da tela dos motoboys.`); break; }
    case 'filtro': S.filtro = S.filtro === el.dataset.k || !el.dataset.k ? null : el.dataset.k; break;
    case 'motos': S.motosAberto = !S.motosAberto; break;
    case 'motos-abrir': S.tela = 2; S.motosAberto = true; break;
    case 'aba': S.tabAba = el.dataset.k; break;
    case 'gaveta': if (S.tela >= 11) S.cel.menu = !S.cel.menu; else S.gaveta = !S.gaveta; break;
    case 'dd': S.dd = !S.dd; break;
    case 'ir6': ir(6); S.cvAberta = false; break;
    case 'conv': { S.conv = el.dataset.id; S.cvAberta = true; const c = D.conversas.find(x => x.id === S.conv); c.nl = 0; break; }
    case 'cv-voltar': S.cvAberta = false; break;
    case 'cv-fechar': S.tela = 2; break;
    case 'conversar': { const c = D.conversas.find(x => x.moto === el.dataset.moto); if (c) { S.conv = c.id; c.nl = 0; c.rasc = `Pedido ${numTxt(ped(el.dataset.id))}: `; } S.cvAberta = true; if (S.tela >= 11) { toast('Abre a conversa com ' + el.dataset.moto); return; } S.tela = 6; break; }
    case 'enviar': {
      const inp = el.closest('.cv-input').querySelector('input');
      const t = inp.value.trim();
      if (!t) { inp.classList.add('erro'); inp.focus(); return; }
      const c = D.conversas.find(x => x.id === S.conv); c.msgs.push(['eu', t, '19:37']); c.h = '19:37'; c.rasc = '';
      render();
      setTimeout(() => { c.msgs.push(['ele', 'Ok! 👍', '19:37']); render(); }, 1400);
      return;
    }
    case 'escolher': { const e2 = ENDERECOS[+el.dataset.i]; S.novo.d = e2; S.novo.erro = false; break; }
    case 'limpar-end': S.novo.d = null; S.novo.end = ''; break;
    case 'marcar': {
      if (e.target.closest('.mk')) return;
      const r = el.firstElementChild.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
      const km = Math.max(0.8, Math.hypot(x - LOJA.x, y - LOJA.y) / 10);
      S.novo.d = { rua: 'Ponto marcado no mapa', bairro: 'confira o número com o cliente', x, y, km: Math.round(km * 10) / 10 }; S.novo.erro = false;
      break;
    }
    case 'criar': {
      if (!S.novo.d) { S.novo.erro = true; break; }
      const d = S.novo.d, id = 'p' + Date.now();
      D.pedidos.unshift({ id, num: 'RP' + Math.random().toString(36).slice(2, 6).toUpperCase(), origem: 'portal', st: 'oferta', moto: null, cliente: S.novo.nome || '', rua: d.rua, bairro: d.bairro, compl: S.novo.compl, ref: S.novo.ref, obs: '', cobra: { tipo: 'online' }, itens: [], prazo: null, criado: '19:37', km: d.km, min: Math.round(d.km * 3.2), dx: d.x, dy: d.y, rodada: 1, cd: 50, tl: [['Pedido criado no portal', '19:37'], ['Oferta aos motoboys perto da loja', '19:37'], ['Motoboy aceita', '', 1], ['Entregue', '', 1]] });
      S.novo = S0().novo; S.ped = id; S.tela = 3; S.de = null;
      toast('Pedido criado. Os motoboys perto da loja já estão recebendo.');
      break;
    }
    case 'ext': S.ext = el.dataset.k; S.extTodos = false; break;
    case 'ext-todos': S.extTodos = true; break;
    case 'fatura': S.fatura = el.dataset.id; S.tela = 9; break;
    case 'cfg': S.cfg = el.dataset.k; break;
    case 'salvar': toast('Conta salva'); return;
    case 'tema': { const esc = !document.documentElement.hasAttribute('data-theme-dark'); $('#tema').value = esc ? 'entregas-escuro' : 'entregas'; aplicaTema(); S.dd = false; break; }
    case 'cel-folha': S.cel.folha = { baixa: 'media', media: 'alta', alta: 'baixa' }[S.cel.folha]; break;
    case 'cel-abrir': S.cel.ped = el.dataset.id; S.mais = false; S.cancel = false; S.ped = el.dataset.id; break;
    case 'cel-ir-pedido': S.tela = 11; S.cel.ped = el.dataset.id; S.ped = el.dataset.id; S.mais = false; break;
    case 'cel-fechar': S.cel.ped = null; break;
    case 'cel-menu': S.cel.menu = !S.cel.menu; break;
    case 'cel-cv': toast('Abre as Conversas (no celular, a tela 6 em página cheia)'); return;
    case 'reiniciar': D = DADOS0(); Object.assign(S, S0()); break;
    case 'toast': toast(el.dataset.msg); return;
  }
  render();
});
document.addEventListener('input', e => {
  const c = e.target.dataset && e.target.dataset.campo;
  if (!c) return;
  if (c === 'msg') { const cv = D.conversas.find(x => x.id === S.conv); cv.rasc = e.target.value; e.target.classList.remove('erro'); return; }
  S.novo[c] = e.target.value;
  if (c === 'end') {
    const box = e.target.parentElement.querySelector('[data-sug]');
    const sugs = e.target.value ? ENDERECOS.filter(x => (x.rua + ' ' + x.bairro).toLowerCase().includes(e.target.value.toLowerCase())).slice(0, 4) : [];
    box.style.display = sugs.length ? '' : 'none';
    box.innerHTML = sugs.map(x => `<button data-act="escolher" data-i="${ENDERECOS.indexOf(x)}"><i class="fa-solid fa-location-dot" style="color:var(--bad);margin-top:3px"></i><span>${x.rua}<small>${x.bairro} · Ribeirão Preto</small></span></button>`).join('');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.campo === 'msg') { e.target.closest('.cv-input').querySelector('[data-act="enviar"]').click(); return; }
  if (e.key === 'Escape') { if (S.gaveta || S.dd || S.cel.menu) { S.gaveta = false; S.dd = false; S.cel.menu = false; } else if (S.tela === 3) S.tela = 2; render(); }
});
function aplicaTema() {
  const v = $('#tema').value;
  $('#theme').href = '../themes/' + v + '.css';
  document.body.classList.toggle('dark-chrome', v.includes('escuro'));
  document.documentElement.toggleAttribute('data-theme-dark', v.includes('escuro'));
}
$('#tema').addEventListener('change', () => { aplicaTema(); render(); });
// relógio da oferta (rodadas de 50 s)
setInterval(() => {
  D.pedidos.filter(p => p.st === 'oferta').forEach(p => {
    p.cd = p.cd <= 0 ? 50 : p.cd - 1;
    if (p.cd === 50) p.rodada = p.rodada >= 3 ? 1 : p.rodada + 1;
  });
  const p = ped(S.ped) || ped(S.cel.ped || '');
  if (!p || p.st !== 'oferta') return;
  document.querySelectorAll('[data-cd]').forEach(x => x.textContent = mmss(p.cd));
  document.querySelectorAll('[data-rod]').forEach(x => x.textContent = p.rodada);
  document.querySelectorAll('[data-barra]').forEach(x => x.style.width = (p.cd / 50 * 100) + '%');
}, 1000);
window.addEventListener('resize', render);
const q = new URLSearchParams(location.search);
if (q.get('v')) S.v = q.get('v');
if (q.get('tela')) S.tela = +q.get('tela');
if (q.get('ped')) S.ped = q.get('ped');
render();
</script>
</body>
