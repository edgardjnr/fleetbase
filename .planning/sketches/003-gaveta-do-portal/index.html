<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 003: gaveta do portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link id="theme" rel="stylesheet" href="../themes/default.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #e9edf2; font-family: var(--font-sans); color: #0f172a; }
body.dark-chrome { background: #05080f; }
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- moldura do sketch (fora do portal) ---------- */
#chrome { position: sticky; top: 0; z-index: 50; background: #0f172a; color: #e2e8f0; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
#chrome .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#chrome .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; margin-right: 6px; font-weight: 700; }
.chip { border: 1px solid #334155; background: #1e293b; color: #e2e8f0; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; transition: all .15s ease; }
.chip:hover { border-color: #60a5fa; }
.chip.on { background: #2563eb; border-color: #2563eb; color: #fff; }
.chip.cmp { border-style: dashed; }
.chip.cmp.on { border-style: solid; }
#desc { font-size: 13px; color: #cbd5e1; max-width: 1100px; line-height: 1.45; }
#desc b { color: #fff; }
#stage { padding: 16px 24px 40px; }
.single { display: flex; justify-content: center; }
.cmpgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.cmpcol h3 { margin: 0 0 8px; font-size: 14px; color: #0f172a; display: flex; gap: 8px; align-items: center; }
body.dark-chrome .cmpcol h3 { color: #e2e8f0; }
.cmpcol h3 span { font-weight: 500; color: #64748b; font-size: 12px; }
.scaler { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 40px rgb(15 23 42 / 25%); }
.scaler > .pf { position: absolute; top: 0; left: 0; transform-origin: top left; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all .2s ease; z-index: 99; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui; font-size: 12px; background: rgba(0,0,0,.75); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: .45; transition: opacity .2s; display: flex; gap: 8px; align-items: center; }
#sketch-tools:hover { opacity: 1; }
#sketch-tools select, #sketch-tools button { background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px; padding: 3px 6px; cursor: pointer; font-size: 12px; }
#sketch-tools button.on { background: #2563eb; border-color: #2563eb; }

/* anotações */
body.annot .pf [data-note] { outline: 2px dashed #d946ef; outline-offset: -2px; position: relative; }
body.annot .pf [data-note]::before { content: attr(data-note); position: absolute; top: 4px; left: 4px; z-index: 5000; background: #d946ef; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }

/* ---------- o portal ---------- */
.pf { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
.pf * { transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease; }
.pf-top { flex: none; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--color-border); background: var(--topbar-bg); position: relative; z-index: 30; }
.pf-acc { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pf-mark { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--color-primary-soft); color: var(--color-primary); }
.pf-eyebrow { font-size: 11px; font-weight: 700; color: var(--color-muted); text-transform: uppercase; letter-spacing: .02em; }
.pf-accname { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-user { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.pf-user:hover { background: var(--color-surface-2); }
.pf-avatar { width: 32px; height: 32px; border-radius: 999px; background: #c7d2fe; color: #3730a3; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.pf-uname { font-weight: 600; font-size: 13px; line-height: 1.2; }
.pf-umail { font-size: 12px; color: var(--color-muted); }
.pf-iconbtn { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-2); cursor: pointer; }
.pf-iconbtn:hover { border-color: var(--color-primary-border); color: var(--color-primary); background: var(--color-primary-soft); }

.pf-main { flex: 1; min-height: 0; display: grid; gap: 16px; padding: 16px; position: relative; }
.pf-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); min-height: 0; }

/* menu */
.pf-menu { padding: 12px; align-self: start; }
.pf-navlabel { padding: 0 8px 4px; font-size: 11px; font-weight: 700; color: var(--color-muted); text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
.pf-item { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px; color: var(--color-text-2); cursor: pointer; white-space: nowrap; }
.pf-item i { width: 18px; text-align: center; flex: none; }
.pf-item:hover { border-color: var(--color-border); background: var(--color-surface-2); }
.pf-item.on { border-color: var(--color-primary-border); color: var(--color-primary-strong); background: var(--color-primary-soft); }
.pf-nav { display: flex; flex-direction: column; gap: 4px; }
.pf-collapse { border: 0; background: transparent; color: var(--color-muted); cursor: pointer; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; }
.pf-collapse:hover { background: var(--color-surface-2); color: var(--color-primary); }

/* A: trilho */
.pf-rail { padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; align-self: start; }
.pf-rail .pf-item { width: 42px; height: 40px; min-height: 0; padding: 0; justify-content: center; position: relative; }
.pf-rail .sep { width: 28px; height: 1px; background: var(--color-border); margin: 4px 0; }
[data-tip] { position: relative; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); background: #0f172a; color: #fff; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 100; pointer-events: none; }
.pf-overmenu { position: absolute; left: 16px; top: 16px; width: 248px; z-index: 25; box-shadow: var(--shadow-lg); animation: slideIn .18s ease; }
.pf-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; animation: fadeIn .18s ease; cursor: pointer; }
@keyframes slideIn { from { transform: translateX(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes dropIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* B: gaveta */
.pf-drawer { position: absolute; left: 0; top: 0; bottom: 0; width: 288px; background: var(--color-surface); z-index: 60; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slideIn .2s ease; }
.pf-drawer-head { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--color-border); }
.pf-drawer .pf-nav { padding: 12px; }
.pf-drawer-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--color-border); display: flex; align-items: center; gap: 10px; }
.pf-scrim.full { z-index: 55; }

/* C: faixa de ícones no topo da coluna */
.pf-strip { display: flex; align-items: center; gap: 4px; padding: 8px; border-bottom: 1px solid var(--color-border); }
.pf-strip .pf-item { min-height: 34px; padding: 0 9px; }
.pf-strip .pf-item:not(.on) { width: 36px; justify-content: center; }
.pf-strip .pf-item:not(.on) span { display: none; }
.pf-strip .grow { flex: 1; }
.pf-strip [data-tip]:hover::after { left: 50%; top: calc(100% + 8px); transform: translateX(-50%); }
.pf-unfold { padding: 8px 12px 12px; border-bottom: 1px solid var(--color-border); background: var(--color-surface-2); animation: dropIn .18s ease; }

/* coluna da lista */
.pf-list { display: flex; flex-direction: column; overflow: hidden; }
.pf-list-head { padding: 14px 14px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.pf-h2 { margin: 2px 0 0; font-size: 16px; font-weight: 800; }
.pf-count { font-size: 12px; font-weight: 700; color: var(--color-primary-strong); background: var(--color-primary-soft); border: 1px solid var(--color-primary-border); border-radius: 999px; padding: 1px 8px; }
.pf-search { margin: 10px 14px; position: relative; }
.pf-search i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--color-muted); font-size: 12px; }
.pf-input { width: 100%; height: 36px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); padding: 0 10px; outline: none; }
.pf-search .pf-input { padding-left: 30px; }
.pf-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-soft); }
.pf-list-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.pf-list-foot { padding: 10px 14px; border-top: 1px solid var(--color-border); font-size: 12px; color: var(--color-muted); display: flex; justify-content: space-between; align-items: center; }
.pf-link { color: var(--color-primary); font-weight: 600; cursor: pointer; }
.pf-link:hover { text-decoration: underline; }
.pf-empty { text-align: center; padding: 28px 12px; color: var(--color-muted); font-size: 13px; }
.pf-empty b { display: block; color: var(--color-text); margin-bottom: 4px; }

/* card do pedido (igual ao atual) */
.oc { border: 1px solid var(--color-border); border-radius: 10px; padding: 12px; background: var(--color-surface); cursor: pointer; flex: none; }
.oc:hover { border-color: var(--color-primary-border); box-shadow: var(--shadow-md); }
.oc.sel { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-soft); }
.oc-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.oc-id { font-weight: 700; }
.oc-sub { font-size: 12px; color: var(--color-muted); }
.selo { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: .03em; border-radius: 4px; padding: 1px 5px; margin-top: 3px; }
.selo.ifood { background: var(--color-ifood); color: #fff; }
.selo.portal { background: var(--color-surface-2); color: var(--color-text-2); border: 1px solid var(--color-border); }
.badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.badge.dispatched { background: var(--color-warning-soft); color: var(--color-warning); }
.badge.accepted { background: var(--color-primary-soft); color: var(--color-primary-strong); }
.badge.route { background: var(--color-success-soft); color: var(--color-success); }
.oc-prog { height: 4px; border-radius: 999px; background: var(--color-surface-2); margin: 10px 0; overflow: hidden; }
.oc-prog span { display: block; height: 100%; background: var(--color-primary); border-radius: 999px; }
.oc-stop { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; }
.mk { width: 20px; height: 20px; flex: none; border-radius: 999px; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; }
.mk.p { background: var(--color-loja); }
.mk.d { background: var(--color-danger); }
.oc-lbl { font-size: 11px; font-weight: 700; color: var(--color-muted); text-transform: uppercase; }
.oc-addr { font-size: 13px; color: var(--color-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oc-meta { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--color-muted); }
.oc-meta i { margin-right: 4px; }

/* seção de pedidos */
.pf-sec { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.pf-sec-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--color-border); }
.pf-h1 { margin: 2px 0 0; font-size: 20px; font-weight: 800; }
.pf-p { margin: 2px 0 0; color: var(--color-muted); font-size: 13px; }
.pf-actions { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--color-text-2); position: relative; }
.btn:hover { border-color: var(--color-primary-border); color: var(--color-primary); }
.btn.primary { background: var(--color-primary); border-color: transparent; color: #fff; }
.btn.primary:hover { background: var(--color-primary-strong); color: #fff; }
.btn.danger { color: var(--color-danger); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 30px; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; height: 32px; }
.seg .btn.on { background: var(--color-primary); color: #fff; }
.dot { position: absolute; top: -6px; right: -6px; background: var(--color-danger); color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; }
.pf-stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }

/* mapa falso */
.map { position: absolute; inset: 0; background: var(--map-land); overflow: hidden; }
.map svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map svg.route { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.zoom { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 6px; overflow: hidden; z-index: 3; }
.zoom span { width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; font-weight: 700; color: var(--color-text-2); }
.zoom span + span { border-top: 1px solid var(--color-border); }
.attr { position: absolute; right: 0; bottom: 0; font-size: 10px; background: var(--color-surface); color: var(--color-muted); padding: 1px 6px; opacity: .8; }
.pin { position: absolute; transform: translate(-50%, -100%); z-index: 2; }
.pin-p { width: 30px; height: 30px; border-radius: 8px 8px 8px 2px; background: var(--color-loja); color: #fff; font-weight: 800; display: grid; place-items: center; box-shadow: var(--shadow-md); border: 2px solid #fff; transform: translate(-50%, -100%) rotate(0); }
.pin-d { color: var(--color-danger); font-size: 22px; filter: drop-shadow(0 2px 2px rgb(0 0 0 / 25%)); }
.pin-d.big { font-size: 30px; }
.pin-d.big b { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); color: #fff; font-size: 11px; }
.pin-d.draft { color: var(--color-primary); font-size: 32px; animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translate(-50%, -110%); } }
.helmet { position: absolute; transform: translate(-50%, -50%); z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.helmet .h { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: #fff; font-size: 13px; border: 2px solid #fff; box-shadow: var(--shadow-md); }
.helmet .h.g { background: #16a34a; } .helmet .h.y { background: #eab308; } .helmet .h.r { background: #dc2626; }
.helmet .n { font-size: 10px; font-weight: 700; background: var(--color-surface); color: var(--color-text); border-radius: 4px; padding: 0 4px; box-shadow: var(--shadow-sm); }
.helmet.mine .n { background: var(--color-primary); color: #fff; }
.maptip { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--color-text-2); box-shadow: var(--shadow-md); z-index: 3; white-space: nowrap; }

/* painel do pedido (direita) */
.panel { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; background: var(--color-surface); border-left: 1px solid var(--color-border); box-shadow: -18px 0 42px rgb(15 23 42 / 14%); z-index: 10; display: flex; flex-direction: column; animation: panelIn .2s ease; }
@keyframes panelIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel-head { padding: 14px 16px; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.panel-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.box { border: 1px solid var(--color-border); border-radius: 10px; padding: 12px; }
.box-t { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--color-muted); margin-bottom: 8px; }
.moto { display: flex; gap: 10px; align-items: center; }
.tl { display: flex; flex-direction: column; gap: 8px; }
.tl div { display: flex; gap: 8px; font-size: 13px; align-items: center; }
.tl i { color: var(--color-success); width: 14px; }
.tl .off i { color: var(--color-border); }
.tl .off { color: var(--color-muted); }
.tl time { margin-left: auto; color: var(--color-muted); font-size: 12px; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label { font-size: 12px; font-weight: 600; color: var(--color-text-2); }
.fixa { display: flex; gap: 8px; align-items: center; padding: 10px; border: 1px dashed var(--color-border); border-radius: 8px; background: var(--color-surface-2); font-size: 13px; }
.saved { display: flex; flex-direction: column; gap: 6px; }
.saved div { padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.saved div:hover, .saved div.on { border-color: var(--color-primary); background: var(--color-primary-soft); }
textarea.pf-input { height: 64px; padding: 8px 10px; resize: none; }

/* extrato */
.ext { padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.kpi { border: 1px solid var(--color-border); border-radius: 10px; padding: 12px; }
.kpi small { color: var(--color-muted); font-size: 12px; }
.kpi b { display: block; font-size: 20px; margin-top: 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--color-muted); padding: 8px; border-bottom: 1px solid var(--color-border); }
table.t td { padding: 9px 8px; border-bottom: 1px solid var(--color-border); color: var(--color-text-2); }
table.t td.r, table.t th.r { text-align: right; }

/* celular */
.pf.phone { border-radius: 28px; border: 8px solid #0f172a; }
.pf.phone .pf-top { height: 56px; padding: 0 12px; }
.ph-map { position: relative; height: 290px; flex: none; }
.ph-sheet { flex: 1; min-height: 0; background: var(--color-surface); border-radius: 16px 16px 0 0; margin-top: -16px; position: relative; z-index: 4; box-shadow: 0 -8px 24px rgb(15 23 42 / 12%); display: flex; flex-direction: column; }
.ph-handle { width: 40px; height: 4px; border-radius: 999px; background: var(--color-border); margin: 8px auto 2px; }
.ph-sheet .pf-list-body { padding-top: 4px; }
.ph-tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--color-border); background: var(--color-surface); }
.ph-tabs div { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 10px; font-size: 10px; color: var(--color-muted); cursor: pointer; }
.ph-tabs div i { font-size: 16px; }
.ph-tabs div.on { color: var(--color-primary); font-weight: 700; }
.fab-novo { text-transform: none; letter-spacing: normal; font-size: 14px; position: absolute; right: 14px; bottom: 76px; z-index: 8; height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--color-primary); color: #fff; font-weight: 700; box-shadow: var(--shadow-lg); display: flex; gap: 8px; align-items: center; cursor: pointer; }
.fab-novo.low { bottom: 18px; }
.pf.phone .pf-strip { background: var(--color-surface); }
.pf.phone .pf-strip .pf-item:not(.on) { width: 40px; }
.pf.phone .oc { padding: 10px; }
.pf.phone .pf-unfold { position: absolute; left: 0; right: 0; top: 0; z-index: 9; box-shadow: var(--shadow-lg); }
</style>
</head>
<body>

<div id="chrome">
  <div class="row" id="vtabs"></div>
  <div class="row" id="stabs"></div>
  <div id="desc"></div>
</div>
<div id="stage"></div>
<div id="toast"></div>

<div id="sketch-tools">
  <span>Tema</span>
  <select id="theme-switcher">
    <option value="default">Claro</option>
    <option value="escuro">Escuro</option>
  </select>
  <span>Tela</span>
  <button data-vp="1366" class="on">Notebook 1366</button>

const I = (n, extra = '') => `<i class="fa-solid fa-${n}" ${extra}></i>`;

function numero(o, cls) {
  return o.num ? `<span class="${cls}">#${o.num}</span>` : `<span class="${cls} semnum">${o.track}</span>`;
}
function selo(o) {
  if (o.origem === 'ifood') return `<span class="selo ifood">iFood</span>`;
  if (o.origem === 'rp') return `<span class="selo rp">RestaurantePro</span>`;
  return `<span class="selo portal">Portal</span>`;
}
function motoTxt(o) {
  return o.moto ? `<span class="hm ${CORMOTO[o.st]}">${I('helmet-safety')}</span>${o.moto}` : `${I('hourglass-half')} procurando motoboy`;
}

function cardA(o, sel) {
  return `<div class="oc ca ${sel}" data-act="card" data-id="${key(o)}" data-text="${txt(o)}">
    <div class="ca-top">${numero(o, 'ca-num')}${selo(o)}<span class="badge ${o.st}">${ST[o.st].label}</span></div>
    <div class="ca-sub">${o.cliente} · pedido às ${o.hora}</div>
    <div class="oc-prog"><span style="width:${o.prog}%"></span></div>
    <div class="ca-foot"><span class="ca-moto ${o.moto ? '' : 'wait'}">${motoTxt(o)}</span>${o.eta ? `<span class="ca-eta">${I('clock')}${o.eta}</span>` : ''}</div>
  </div>`;
}
function cardB(o, sel) {
  return `<div class="oc cb st-${o.st} ${sel}" data-act="card" data-id="${key(o)}" data-text="${txt(o)}">
    <div class="cb-l"><div class="cb-num">${numero(o, '')}${selo(o)}</div>

}
function cardC(o, sel) {

    <div class="cc-top">${numero(o, 'cc-num')}${selo(o)}<span class="hora">${o.cliente} · ${o.hora}</span></div>

}

let MAPSVG = null;
function mapSvg() {
  if (MAPSVG) return MAPSVG;
  let s = `<svg class="bg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"><rect width="1000" height="700" fill="var(--map-land)"/>
    <rect x="720" y="430" width="200" height="140" rx="18" fill="var(--map-park)"/><rect x="90" y="120" width="120" height="90" rx="14" fill="var(--map-park)"/>
    <path d="M-20 640 C 200 600, 320 690, 520 650 S 860 600, 1020 660 L1020 720 L-20 720Z" fill="var(--map-water)"/>`;
  const roads = [];
  for (let i = 0; i < 8; i++) { const y = 40 + i * 90; roads.push(`M-10 ${y} L1010 ${y + 30}`); }
  for (let i = 0; i < 10; i++) { const x = 30 + i * 110; roads.push(`M${x} -10 L${x - 60} 710`); }
  s += roads.map(d => `<path d="${d}" stroke="var(--map-road-edge)" stroke-width="13" fill="none"/>`).join('');
  s += roads.map(d => `<path d="${d}" stroke="var(--map-road)" stroke-width="9" fill="none"/>`).join('');
  s += `<path d="M-10 520 L1010 180" stroke="var(--map-road-edge)" stroke-width="24" fill="none"/><path d="M-10 520 L1010 180" stroke="var(--map-road)" stroke-width="18" fill="none"/>
    <text x="610" y="300" fill="var(--map-label)" font-size="15" font-weight="600" transform="rotate(-18 610 300)" font-family="Inter">Av. Paulista</text>
    <text x="356" y="330" fill="var(--map-label)" font-size="12" transform="rotate(82 356 330)" font-family="Inter">R. Augusta</text></svg>`;
  return (MAPSVG = s);
}

function mapHTML(phone = false) {
  const det = S.det ? pedidos().find(o => key(o) === S.sel) : null;
  const D = det ? { x: det.x > 46 ? Math.max(14, det.x - 38) : det.x, y: det.y } : null;
  let h = `<div class="map" data-note="Mapa">${mapSvg()}`;
  if (det) h += `<svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${LOJA.x},${LOJA.y - 2} ${(LOJA.x + D.x) / 2 + 4},${(LOJA.y + D.y) / 2} ${D.x},${D.y - 2}" fill="none" stroke="var(--color-primary)" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".85"/></svg>`;
  if (!phone) h += `<div class="zoom"><span>+</span><span>−</span></div>`;
  h += `<div class="pin pin-p" style="left:${LOJA.x}%;top:${LOJA.y}%">P</div>`;
  pedidos().forEach(o => {
    if (det && key(o) === key(det)) h += `<div class="pin pin-d big" style="left:${D.x}%;top:${D.y}%">${I('location-pin')}<b>D</b></div>`;
    else if (!det) h += `<div class="pin pin-d" style="left:${o.x}%;top:${o.y}%" data-act="card" data-id="${key(o)}" title="${o.num ? '#' + o.num : o.track}">${I('location-pin')}</div>`;
  });
  MOTOS.forEach(m => {
    const mine = det && det.moto === m.n;
    const pos = mine ? { x: (LOJA.x + D.x) / 2 + 3, y: (LOJA.y + D.y) / 2 } : m;
    h += `<div class="helmet ${mine ? 'mine' : ''}" style="left:${pos.x}%;top:${pos.y}%"><div class="h ${m.c}">${I('helmet-safety')}</div><div class="n">${m.n}</div></div>`;
  });
  return h + `<div class="attr">© OpenStreetMap</div></div>`;
}

  const peds = q ? pedidos().filter(o => (o.num || o.track || '').toLowerCase().includes(qn) || o.cliente.toLowerCase().includes(q)) : [];
  const novo = !q || 'novo pedido'.includes(q);
  let h = `<div class="dC-grid">${itens.map(([k, ic, n]) => `<div class="dC-tile ${k === ATIVO ? 'on' : ''}" data-act="nav" data-n="${n}">${I(ic)}<span>${n}</span>${k === ATIVO ? `<em>${HOJE.andamento}</em>` : ''}</div>`).join('')}${novo ? `<div class="dC-tile novo" data-act="toast" data-msg="Abre o Novo pedido">${I('plus')}<span>Novo pedido</span></div>` : ''}</div>`;

}

  if (S.screen === 3) {
    const h = `${topbar(true)}<div class="ph-map">${mapHTML(true)}</div><div class="ph-sheet"><div class="ph-handle"></div>${listInner(v, true)}</div>
      <button class="fab-novo low" data-act="toast" data-msg="Novo pedido em tela cheia">${I('plus')} Novo pedido</button>${S.open ? drawer(v) : ''}`;
    return { html: `<div class="pf phone${dk}" style="width:375px;height:780px">${h}</div>`, w: 375, h: 780 };
  }
  const w = S.vp, hh = S.vp === 1920 ? 1000 : 768;
  const main = `<div class="pf-main" style="grid-template-columns:340px minmax(0,1fr)"><div class="pf-card pf-list">${listInner(v)}</div>${section()}</div>`;
  return { html: `<div class="pf${dk}" style="width:${w}px;height:${hh}px">${topbar()}${main}${S.open ? drawer(v) : ''}</div>`, w, h: hh };
}

/* ======================= render ======================= */
function scaled(f, availW, availH) {
  const s = Math.min(1, availW / f.w, availH ? availH / f.h : 1);
  return `<div class="scaler" style="width:${Math.floor(f.w * s)}px;height:${Math.floor(f.h * s)}px">${f.html.replace('style="width:', `style="transform:scale(${s});width:`)}</div>`;
}
function render() {
  document.getElementById('vtabs').innerHTML = `<span class="lbl">Gaveta</span>` +
    ['a', 'b', 'c'].map(k => `<button class="chip ${S.variant === k ? 'on' : ''}" data-v="${k}">${VARIANTS[k].nome}</button>`).join('') +
    `<button class="chip cmp ${S.variant === 'cmp' ? 'on' : ''}" data-v="cmp">${I('table-columns')} Comparar por tela</button>`;
  document.getElementById('stabs').innerHTML = `<span class="lbl">Tela</span>` + SCREENS.map(([n, t]) => `<button class="chip ${S.screen === n ? 'on' : ''}" data-s="${n}">${t}</button>`).join('');
  document.getElementById('desc').innerHTML = S.variant === 'cmp'
    ? '<b>Comparar por tela:</b> A, B e C lado a lado, na mesma tela. Os cliques (fechar, ☰, tema, busca) valem para os três.'
    : VARIANTS[S.variant].desc;
  const stage = document.getElementById('stage');
  const chromeH = document.getElementById('chrome').offsetHeight;
  const availW = window.innerWidth - 48, availH = window.innerHeight - chromeH - 56;
  if (S.variant === 'cmp') {
    stage.className = 'cmpgrid';
    stage.innerHTML = ['a', 'b', 'c'].map(v => `<div class="cmpcol"><h3>${VARIANTS[v].nome}</h3>${scaled(frame(v), (availW - 32) / 3)}</div>`).join('');
  } else {
    stage.className = 'single';
    stage.innerHTML = scaled(frame(S.variant), availW, Math.max(availH, 420));
  }
}

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

document.addEventListener('click', (e) => {
  const vt = e.target.closest('#vtabs [data-v]');
  if (vt) { S.variant = vt.dataset.v; S.open = true; S.det = false; render(); return; }
  const st = e.target.closest('#stabs [data-s]');
  if (st) { S.screen = +st.dataset.s; S.open = true; S.det = false; if (S.screen !== 3) S.dark = S.screen === 2; syncTema(); render(); return; }
  const el = e.target.closest('.pf [data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'search' || act === 'busca-c' || act === 'tema-switch') return;
  if (act === 'tema') { S.dark = el.dataset.v === '1'; if (S.screen !== 3) S.screen = S.dark ? 2 : 1; syncTema(); render(); return; }
  if (act === 'nav') { S.open = false; render(); toast(el.dataset.n === 'Pedidos' ? 'Você já está em Pedidos' : 'Abre ' + el.dataset.n); return; }
  if (act === 'menu') { S.open = !S.open; render(); return; }
  if (act === 'close-menu') { S.open = false; S.busca = ''; render(); return; }
  if (act === 'card') {
    if (S.screen === 3) { S.open = false; render(); toast('No celular, o pedido abre em tela cheia'); return; }
    S.sel = el.dataset.id; S.det = true; S.open = false; S.busca = ''; render(); return;
  }
  if (act === 'close-panel') { S.det = false; render(); return; }
  if (act === 'toast') { toast(el.dataset.msg); return; }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.act !== 'tema-switch') return;
  S.dark = e.target.checked; if (S.screen !== 3) S.screen = S.dark ? 2 : 1; syncTema(); render();
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); S.open = true; render();
    const i = document.querySelector('.pf [data-act="busca-c"]'); if (i) i.focus(); else toast('A busca Ctrl K é da variante C');
  }
  if (e.key === 'Escape' && S.open) { S.open = false; S.busca = ''; render(); }
});
function syncTema() {
  const sel = document.getElementById('theme-switcher'); if (sel) sel.value = S.dark ? 'escuro' : 'default';
  document.body.classList.toggle('dark-chrome', S.dark);
}
document.addEventListener('input', (e) => {
  if (e.target.dataset.act === 'busca-c') {
    S.busca = e.target.value;
    document.querySelectorAll('.pf .dC-blocos').forEach(b => { b.innerHTML = blocosC(); });
    document.querySelectorAll('.pf [data-act="busca-c"]').forEach(inp => { if (inp !== e.target) inp.value = S.busca; });
    return;
  }
  if (e.target.dataset.act !== 'search') return;
  S.query = e.target.value;
  const q = S.query.trim().toLowerCase();
  document.querySelectorAll('.pf .pf-list-body').forEach(body => {
    let vis = 0;
    body.querySelectorAll('.oc').forEach(c => { const ok = !q || c.dataset.text.includes(q); c.style.display = ok ? '' : 'none'; if (ok) vis++; });
    const empty = body.querySelector('.pf-empty.busca');
    if (!vis && !empty) body.insertAdjacentHTML('beforeend', `<div class="pf-empty busca"><b>Nenhum pedido encontrado</b>Tente o número do pedido, o cliente ou o motoboy.</div>`);
    if (vis && empty) empty.remove();
  });
  document.querySelectorAll('.pf [data-act="search"]').forEach(inp => { if (inp !== e.target) inp.value = S.query; });
});
document.getElementById('theme-switcher').addEventListener('change', (e) => {
  S.dark = e.target.value === 'escuro'; if (S.screen !== 3) S.screen = S.dark ? 2 : 1; syncTema(); render();
});
document.querySelectorAll('#sketch-tools [data-vp]').forEach(b => b.addEventListener('click', () => {
  S.vp = +b.dataset.vp; document.querySelectorAll('#sketch-tools [data-vp]').forEach(x => x.classList.toggle('on', x === b)); render();
}));
document.getElementById('annot-btn').addEventListener('click', (e) => { document.body.classList.toggle('annot'); e.target.classList.toggle('on'); });
window.addEventListener('resize', render);
render();
</script>
</body>
</html>
