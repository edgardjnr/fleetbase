<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 004: painel inicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link id="theme" rel="stylesheet" href="../themes/entregas.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #e7e2da; font-family: system-ui, sans-serif; color: #1c1917; }
body.dark-chrome { background: #0c0a09; }
button, input, select { font: inherit; color: inherit; }

/* ---------- moldura do sketch (fora do painel) ---------- */
#chrome { position: sticky; top: 0; z-index: 50; background: #1c1917; color: #e7e5e4; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
#chrome .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#chrome .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a8a29e; margin-right: 6px; font-weight: 700; }
.chip { border: 1px solid #44403c; background: #292524; color: #e7e5e4; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; transition: all .15s ease; }
.chip:hover { border-color: #fb923c; }
.chip.on { background: #ea7a1a; border-color: #ea7a1a; color: #1c1917; font-weight: 600; }
.chip.cmp { border-style: dashed; }
.chip.cmp.on { border-style: solid; }
#desc { font-size: 13px; color: #d6d3d1; max-width: 1200px; line-height: 1.45; }
#desc b { color: #fff; }
#stage { padding: 16px 24px 60px; }
.single { display: flex; justify-content: center; }
.cmpgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.cmpcol h3 { margin: 0 0 8px; font-size: 14px; color: #1c1917; }
body.dark-chrome .cmpcol h3 { color: #e7e5e4; }
.frame { width: max-content; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 40px rgb(28 25 23 / 25%); }
.frame.phone { border-radius: 34px; border: 10px solid #1c1917; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1c1917; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all .2s ease; z-index: 99; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui; font-size: 12px; background: rgba(0,0,0,.75); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: .45; transition: opacity .2s; display: flex; gap: 8px; align-items: center; }
#sketch-tools:hover { opacity: 1; }
#sketch-tools select, #sketch-tools button { background: #292524; color: #fff; border: 1px solid #44403c; border-radius: 6px; padding: 3px 6px; cursor: pointer; font-size: 12px; }
#sketch-tools button.on { background: #ea7a1a; border-color: #ea7a1a; color: #1c1917; }

/* anotações: mostra o nome de cada bloco */
body.annot .pf [data-block] { outline: 2px dashed #c026d3; outline-offset: -2px; position: relative; }
body.annot .pf [data-block]::before { content: attr(data-block); position: absolute; top: 4px; right: 6px; background: #c026d3; color: #fff; font: 600 11px system-ui; padding: 1px 6px; border-radius: 4px; z-index: 30; pointer-events: none; }

/* modal de atribuir (fora do quadro) */
#modal { position: fixed; inset: 0; z-index: 200; display: none; place-items: center; background: rgb(28 25 23 / 45%); backdrop-filter: blur(3px); }
#modal.show { display: grid; }
#modal .box { width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border-radius: 16px; box-shadow: var(--shadow-lg); font-family: var(--font-body); overflow: hidden; animation: subir .18s ease; }
@keyframes subir { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
#modal .mh { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
#modal .mh h2 { margin: 0; font-family: var(--font-display); font-size: 24px; text-transform: uppercase; letter-spacing: .01em; }
#modal .mh p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
#modal .ml { max-height: 340px; overflow: auto; }
#modal .mr { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
#modal .mr img { width: 30px; height: 30px; }
#modal .mr div { flex: 1; }
#modal .mr small { display: block; color: var(--muted); font-size: 13px; }
#modal .mf { padding: 12px 20px 16px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
#modal .mf .btn { margin-left: auto; }

/* ================= o painel (dentro do quadro) ================= */
.pf { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.4; }
.pf * { box-sizing: border-box; }
.pf h1, .pf h2, .pf h3 { margin: 0; }
.pf .num, .pf .disp { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.pf .muted { color: var(--muted); }
.pf a { color: inherit; text-decoration: none; }

/* cabeçalho do console (igual nas três variantes) */
.sh { height: 56px; display: flex; align-items: center; gap: 22px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 3; }
.sh-logo { display: flex; align-items: center; gap: 10px; flex: none; }
.sh-logo .ic { width: 32px; height: 32px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; color: var(--brand-ink); font-size: 15px; }
.sh-logo b { font-family: var(--font-display); font-size: 21px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; line-height: 1; display: block; }
.sh-logo small { display: block; font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.sh-nav { display: flex; gap: 2px; height: 100%; }
.sh-nav a { display: flex; align-items: center; padding: 0 12px; color: var(--ink-2); font-weight: 500; border-bottom: 3px solid transparent; cursor: pointer; transition: all .15s ease; }
.sh-nav a.on { color: var(--ink); border-bottom-color: var(--brand); font-weight: 700; }
.sh-nav a:hover { color: var(--ink); background: var(--surface-2); }
.sh-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.sh-search { width: 290px; height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--muted); }
.sh-search input { border: 0; background: transparent; outline: 0; flex: 1; min-width: 0; color: var(--ink); }
.kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.icbtn { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; position: relative; color: var(--ink-2); transition: all .15s ease; }
.icbtn:hover { background: var(--surface-2); color: var(--ink); }
.icbtn .dot { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; font-weight: 700; border: 2px solid var(--surface); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 13px; cursor: pointer; flex: none; }
.sh-org { font-size: 12px; line-height: 1.2; }
.sh-org b { display: block; font-size: 13px; }
.sh-org span { color: var(--muted); }

/* peças comuns */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; flex-wrap: wrap; }
.card-h h3 { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.card-h .sub { color: var(--muted); font-size: 13px; }
.card-h .lnk { margin-left: auto; font-size: 13px; color: var(--brand-text); font-weight: 700; cursor: pointer; }
.card-h .lnk:hover { text-decoration: underline; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex: none; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--ink-2); font-size: 13px; transition: all .15s ease; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; transition: all .15s ease; white-space: nowrap; flex: none; }
.btn.brand { background: var(--brand); color: var(--brand-ink); }
.btn.brand:hover { background: var(--brand-strong); }
.btn.ink { background: var(--ink); color: var(--bg); }
.btn.ink:hover { opacity: .88; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ok); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulso 1.6s infinite; }
@keyframes pulso { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes pulsoR { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--bad) 55%, transparent); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; white-space: nowrap; letter-spacing: .03em; text-transform: uppercase; }
.b-ifood { background: var(--ifood); color: #fff; }
.b-rp { background: var(--ink); color: var(--bg); }
.pz { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.pz.g { background: var(--ok-soft); color: var(--ok); }
.pz.y { background: var(--warn-soft); color: var(--warn-text); }
.pz.r { background: var(--bad); color: #fff; }
.ofr { color: var(--bad); font-weight: 700; font-size: 12px; white-space: nowrap; }
.ofr span { font-variant-numeric: tabular-nums; }
.cap { width: 28px; height: 28px; flex: none; }
.ifs { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.ifs i { width: 7px; height: 7px; border-radius: 50%; }
.ifs.on i { background: var(--ok); }
.ifs.rp i { background: var(--muted); }
.ifs.erro { color: var(--bad); }
.ifs.erro i { background: var(--bad); animation: pulsoR 1.4s infinite; }

/* filtros da fila */
.flt { display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
.flt button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap; transition: all .15s ease; display: inline-flex; gap: 6px; align-items: center; flex: none; }
.flt button b { font-family: var(--font-display); font-size: 15px; }
.flt button:hover { border-color: var(--brand); }
.flt button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.flt button.alerta { border-color: var(--bad); color: var(--bad); }
.flt button.alerta.on { background: var(--bad); color: #fff; }

/* linha da fila (A) */
.fr { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); cursor: pointer; transition: background .15s ease; }
.fr:hover { background: var(--surface-2); }
.fr.oferta { background: color-mix(in oklch, var(--bad-soft) 70%, transparent); }
.fr.atr { box-shadow: inset 3px 0 0 var(--bad); }
.fr-main { flex: 1; min-width: 0; }
.fr-l1 { display: flex; align-items: center; gap: 6px; }
.fr-l1 b { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.fr-l2 { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr-st { text-align: right; font-size: 13px; font-weight: 600; line-height: 1.25; flex: none; }
.fr-st small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.vazio { padding: 28px 16px; text-align: center; color: var(--muted); border-top: 1px solid var(--line); }
.vazio i { display: block; font-size: 22px; color: var(--ok); margin-bottom: 6px; }

/* cartão da fila (B e celular C) */
.fc { margin: 0 12px 8px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; transition: all .15s ease; }
.fc:hover { border-color: var(--brand); box-shadow: var(--shadow-sm); }
.fc.oferta { border-color: var(--bad); background: color-mix(in oklch, var(--bad-soft) 70%, var(--surface)); }
.fc.atr { border-color: var(--bad); }
.fc-t { display: flex; align-items: center; gap: 8px; }
.fc-t b { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.fc-t .pz, .fc-t .btn { margin-left: auto; }
.fc-m { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.fc-m .cap { width: 22px; height: 22px; }
.fc-m span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.bar i.g { background: var(--ok); } .bar i.y { background: var(--warn); } .bar i.r { background: var(--bad); }

/* tabela da fila (C desktop) */
.tb { width: 100%; border-collapse: collapse; font-size: 13px; }
.tb th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.tb td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tb tr.lin { cursor: pointer; transition: background .15s ease; }
.tb tr.lin:hover td { background: var(--surface-2); }
.tb tr.oferta td { background: color-mix(in oklch, var(--bad-soft) 70%, transparent); }
.tb tr.atr td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.tb .pnum { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.tb .cm { display: flex; align-items: center; gap: 6px; }
.tb .cm img { width: 22px; height: 22px; }

/* mapa */
.mapa { position: relative; overflow: hidden; background: var(--map-land); border-radius: 12px; }
.mapa svg.ruas { position: absolute; inset: 0; width: 100%; height: 100%; }
.mk { position: absolute; transform: translate(-50%, -50%); cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: transform .15s ease; z-index: 2; }
.mk:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 6; }
.mk img { width: 30px; height: 30px; filter: drop-shadow(0 2px 2px rgb(0 0 0 / 30%)); }
.mk .nm { font-size: 10px; font-weight: 700; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 0 5px; border-radius: 6px; margin-top: -3px; white-space: nowrap; }
.mk.loja { transform: translate(-50%, -100%); z-index: 3; }
.mk.loja:hover { transform: translate(-50%, -100%) scale(1.12); }
.mk.loja img { width: 30px; height: 36px; object-fit: contain; }
.mk.loja .nm { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mk.dest { transform: translate(-50%, -100%); color: var(--bad); font-size: 20px; z-index: 1; filter: drop-shadow(0 1px 1px rgb(0 0 0 / 30%)); }
.mk.dest:hover { transform: translate(-50%, -100%) scale(1.15); }
.mk.dest.oferta { animation: pulsoR 1.4s infinite; border-radius: 50%; }
.leg { display: inline-flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.leg span { display: inline-flex; align-items: center; gap: 4px; }
.leg img { width: 18px; height: 18px; }
.mapa .ov { position: absolute; z-index: 8; }

/* gráfico de barras */
.gr { display: flex; align-items: flex-end; gap: 4px; padding: 6px 16px 0; }
.gr .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; cursor: default; }
.gr .bx { position: relative; width: 100%; height: var(--gh, 120px); display: flex; align-items: flex-end; }
.gr .b { width: 100%; border-radius: 4px 4px 0 0; background: color-mix(in oklch, var(--brand) 55%, var(--surface-2)); transition: background .15s ease; }
.gr .col:hover .b { background: var(--brand); }
.gr .b.agora { background: repeating-linear-gradient(135deg, var(--brand) 0 6px, var(--brand-strong) 6px 12px); }
.gr .md { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--ink); opacity: .35; border-radius: 2px; }
.gr .hl { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; height: 14px; }
.gr-leg { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 8px 16px 14px; }
.gr-leg span { display: inline-flex; align-items: center; gap: 6px; }
.gr-leg i { width: 12px; height: 8px; border-radius: 2px; background: color-mix(in oklch, var(--brand) 55%, var(--surface-2)); }
.gr-leg i.md { height: 2px; background: var(--ink); opacity: .4; }

/* listas de lojas e motoboys */
.ls { padding: 0 16px 12px; }
.ls .li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.ls .li:hover .nmL { color: var(--brand-text); }
.ls .li .rk { width: 18px; color: var(--muted); font-weight: 700; font-size: 12px; text-align: center; flex: none; }
.ls .li .cap { width: 24px; height: 24px; }
.ls .li .nmL { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .15s ease; }
.ls .li .nmL small { display: block; font-weight: 500; }
.ls .li .vv { text-align: right; flex: none; font-size: 13px; line-height: 1.2; }
.ls .li .vv b { font-family: var(--font-display); font-size: 18px; display: block; }
.ls .li .vv small { color: var(--muted); }
.ls .mini { height: 5px; border-radius: 5px; background: var(--surface-2); margin-top: 4px; overflow: hidden; }
.ls .mini i { display: block; height: 100%; background: var(--brand); border-radius: 5px; }

/* atenção */
.at { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--line); }
.at .ai { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.at .ai.bad { background: var(--bad-soft); color: var(--bad); }
.at .ai.warn { background: var(--warn-soft); color: var(--warn-text); }
.at .ai.muted { background: var(--surface-2); color: var(--muted); }
.at .ab { flex: 1; min-width: 0; }
.at .ab b { display: block; font-size: 14px; }
.at .ab small { color: var(--muted); font-size: 13px; }
.at .btn { margin-top: 2px; }
.atRow { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
.atRow .at { border-top: 0; border-left: 1px solid var(--line); }
.atRow .at:first-child { border-left: 0; }

/* cabeçalho da página (A e B) */
.ph { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.ph h1 { font-family: var(--font-display); font-size: 34px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1; }
.ph p { margin: 4px 0 0; color: var(--muted); }
.ph .acts { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.m .ph h1 { font-size: 28px; }
.m .ph .acts { margin-left: 0; width: 100%; justify-content: space-between; }

/* ============ Variante A: faixa + sala de controle ============ */
.vA { padding: 22px 24px 32px; display: flex; flex-direction: column; gap: 18px; }
.kA { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kA .k { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; position: relative; overflow: hidden; }
.kA .k:first-child { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.kA .k:first-child .kl, .kA .k:first-child .kd { color: var(--brand-ink); opacity: .8; }
.kA .kl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.kA .kv { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1.05; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kA .kd { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kA .k.warn { border-color: var(--warn); background: var(--warn-soft); }
.kA .k.warn .kv { color: var(--warn-text); }
.alA { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; background: var(--bad); color: #fff; }
.alA i.fa-solid { font-size: 20px; }

/* ======================= derivados ======================= */
const sc = () => pico() ? CENARIOS.pico : CENARIOS.normal;
const restante = p => p.prazo - p.min;
const tomPz = p => { const r = restante(p); return r < 0 ? 'r' : r <= 15 ? 'y' : 'g'; };
const atrasado = p => p.st !== 'oferta' && restante(p) < 0;
function counts() {
  const ps = sc().pedidos;
  return { todos: ps.length, oferta: ps.filter(p => p.st === 'oferta').length, loja: ps.filter(p => p.st === 'loja').length, rota: ps.filter(p => p.st === 'rota').length, atrasado: ps.filter(atrasado).length };
}
function motoStatus(nome) {
  const p = sc().pedidos.find(x => x.moto === nome);
  return p ? p.st : 'livre';
}
function motosOnline() {
  const c = sc();
  return c.online.map(nome => {
    const p = c.pedidos.find(x => x.moto === nome);
    const pos = p ? [p.mx, p.my] : (c.livresPos[nome] || [50, 50]);
    return { nome, st: p ? p.st : 'livre', x: pos[0], y: pos[1], ped: p };
  });
}
const capSrc = st => IMG + 'capacete-' + ({ livre: 'verde', loja: 'amarelo', rota: 'vermelho', oferta: 'cinza' }[st] || 'cinza') + '.png';
function ordenados() {
  const ord = p => p.st === 'oferta' ? -1000 + p.cd / 100 : atrasado(p) ? -500 + restante(p) : restante(p);
  return [...sc().pedidos].sort((a, b) => ord(a) - ord(b));
}
function filtrados() {
  const f = S.filtro;

const brl = n => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brl0 = n => 'R$ ' + Math.round(n).toLocaleString('pt-BR');

const mmss = s => '0:' + String(Math.max(0, s)).padStart(2, '0');
const fator = () => PER[S.periodo].corridas / 142;

const segPeriodo = () => `<div class="seg">${Object.entries(PER).map(([k, v]) => `<button class="${S.periodo === k ? 'on' : ''}" data-act="periodo" data-v="${k}">${v.rot}</button>`).join('')}</div>`;

function grafico(h = 120, legendaOn = true) {
  const g = GRAF[S.periodo];
  const max = Math.max(...g.v.filter(x => x != null), ...(g.md || [0]));
  const cols = g.rot.map((r, i) => {
    const v = g.v[i], md = g.md ? g.md[i] : null;
    const tip = `${r}: ${v == null ? 'ainda não chegou' : v + ' corridas'}${md != null ? ' (média ' + md + ')' : ''}`;
    return `<div class="col" title="${tip}"><div class="bx">${v != null ? `<div class="b ${i === g.agora ? 'agora' : ''}" style="height:${v / max * 100}%"></div>` : ''}${md != null ? `<div class="md" style="bottom:${md / max * 100}%"></div>` : ''}</div><div class="hl">${i % g.cada === 0 ? r : ''}</div></div>`;
  }).join('');
  const leg = legendaOn ? `<div class="gr-leg"><span><i></i>${S.periodo === 'hoje' ? 'hoje' : S.periodo === 'semana' ? 'esta semana' : 'últimos 30 dias'}</span>${g.md ? `<span><i class="md"></i>${S.periodo === 'hoje' ? 'média dos sábados' : 'semana passada'}</span>` : ''}</div>` : '';
  return `<div class="gr" style="--gh:${h}px">${cols}</div>${leg}`;
}

function corpoB(m) {
  const c = counts(), o = resumoOnline();
  const k = kpis().map((x, i) => `<div class="k ${i === 0 ? 'hero' : ''} ${x.tom || ''}"><div class="ki"><i class="fa-solid fa-${x.ic}"></i></div><div class="kt"><div class="kl">${x.l}</div><div class="kv">${x.v}</div></div><div class="kd">${x.d}</div></div>`).join('');
  const chip = (k, img, n, t, al) => `<div class="mchip ${S.filtro === k ? 'on' : ''} ${al ? 'alerta' : ''}" data-act="filtro" data-v="${k}">${img}<b>${n}</b><span>${t}</span></div>`;
  const chips = `<div class="ov mchips">
    ${chip('oferta', `<i class="fa-solid fa-tower-broadcast" style="font-size:18px"></i>`, c.oferta, 'sem<br>motoboy', c.oferta > 0 && pico())}
    ${chip('atrasado', `<i class="fa-regular fa-clock" style="font-size:18px"></i>`, c.atrasado, 'atra-<br>sados', c.atrasado > 0)}
    ${chip('loja', `<img src="${capSrc('loja')}" alt="">`, c.loja, 'indo à<br>loja')}
    ${chip('rota', `<img src="${capSrc('rota')}" alt="">`, c.rota, 'a<br>caminho')}
    <div class="mchip online" data-act="toast" data-msg="${o.livres} livres de ${o.on} online"><img src="${capSrc('livre')}" alt=""><b>${o.livres}</b><span>livres de<br>${o.on} online</span></div>
  </div>`;
  const grOv = `<div class="ov mgr" data-block="Corridas por hora/dia"><div class="card-h"><h3>${GRAF[S.periodo].tit}</h3><span class="sub">${tituloPer()}</span></div>${grafico(70)}</div><div class="ov mleg">${legenda()}</div>`;
  const precisa = pico() && (c.oferta || c.atrasado) ? `<div class="precisa"><i class="fa-solid fa-bell" style="font-size:18px"></i><div><b>Precisa de você</b>${c.oferta} sem motoboy e ${c.atrasado} atrasados, no topo da fila</div></div>` : '';
  const filaH = `<div class="fila-h"><h2>Fila ao vivo</h2><span class="live"><i></i></span>${btnNovo()}</div>${precisa}${filtros()}`;
  const esquerda = `<div class="rail" data-block="Números do período + Atenção">
      <div class="rl-h"><h1>Boa noite, Edgard</h1><p>${hoje()} · ${sc().hora}</p>${segPeriodo()}</div>
      <div class="kB">${k}</div>
      ${m ? '' : `<div class="rl-sec">Atenção <span class="n">${atencao().length}</span></div>${itensAtencao()}`}
    </div>`;
  if (m) {
    return `<div class="vB m">
      <div class="rail"><div class="rl-h"><h1>Boa noite, Edgard</h1><p>${hoje()} · ${sc().hora}</p>${segPeriodo()}</div></div>
      <div class="centro" data-block="Mapa ao vivo + contagens">${mapa(0, chips, false)}</div>
      <div class="kB" data-block="Números do período">${k}</div>
      <div class="rail dir" data-block="Fila ao vivo">${filaH}${lista(cartao)}</div>
      <div class="card grB" data-block="Corridas por hora/dia"><div class="card-h"><h3>${GRAF[S.periodo].tit}</h3><span class="sub">${tituloPer()}</span></div>${grafico(100)}</div>
      <div class="baixo">
        <div class="card" data-block="Atenção"><div class="card-h"><h3>Atenção</h3><span class="sub">${atencao().length} itens</span></div>${itensAtencao()}</div>
        <div class="card" data-block="Lojas no período"><div class="card-h"><h3>Lojas</h3><span class="sub">${tituloPer()}</span></div>${listaLojas()}</div>
        <div class="card" data-block="Motoboys no período"><div class="card-h"><h3>Motoboys</h3><span class="sub">${tituloPer()}</span></div>${listaMotos(6)}</div>
      </div>
    </div>`;
  }
  return `<div class="vB">
    <div class="gB">
      ${esquerda}
      <div class="centro" data-block="Mapa ao vivo + contagens">${mapa(0, chips + grOv)}</div>
      <div class="rail dir" data-block="Fila ao vivo">${filaH}<div style="padding-bottom:12px">${lista(cartao)}</div></div>
    </div>
    <div class="baixo">
      <div class="card" data-block="Lojas no período"><div class="card-h"><h3>Lojas</h3><span class="sub">${tituloPer()}</span><span class="lnk" data-act="nav" data-n="Lojas">Todas →</span></div>${listaLojas()}</div>
      <div class="card" data-block="Motoboys no período"><div class="card-h"><h3>Motoboys</h3><span class="sub">${tituloPer()}</span><span class="lnk" data-act="nav" data-n="Motoboys">Todos →</span></div>${listaMotos(5)}</div>
    </div>
  </div>`;
}

/* ======================= Variante C ======================= */
function corpoC(m) {
  const c = counts(), o = resumoOnline(), ks = kpis(), d = PER[S.periodo];
  const primOferta = ordenados().find(p => p.st === 'oferta');
  const nums = ks.slice(1).map(x => `<div><small>${x.l}</small><b class="${x.tom ? 'alerta' : ''}">${x.v}</b></div>`).join('') + `<div><small>Km rodados</small><b>${int(d.km)}</b></div>`;
  const tiles = [
    { k: 'oferta', ic: 'tower-broadcast', t: 'Sem motoboy', n: c.oferta, d: c.oferta ? (primOferta ? ofertaTxt(primOferta) : '') : 'todos os pedidos têm motoboy', tom: c.oferta ? (pico() ? 'bad' : 'warn') : 'ok', btn: c.oferta && primOferta ? btnAtribuir(primOferta, pico() ? '' : 'brand') : '' },
    { k: 'atrasado', ic: 'clock', t: 'Atrasados', n: c.atrasado, d: c.atrasado ? 'passaram do prazo do iFood' : 'nenhum passou do prazo', tom: c.atrasado ? 'bad' : 'ok', btn: c.atrasado ? `<button class="btn sm" data-act="filtro" data-v="atrasado">Ver pedidos</button>` : '' },
    { k: 'rota', ic: 'route', t: 'Em andamento', n: c.loja + c.rota, d: `${c.loja} indo à loja · ${c.rota} a caminho`, tom: '', btn: '' },
    { k: 'livres', ic: 'helmet-safety', t: 'Motoboys livres', n: o.livres, d: `de ${o.on} online`, tom: o.livres <= 2 ? 'warn' : 'ok', btn: '' },
  ].map(t => `<div class="t ${t.tom} ${S.filtro === t.k ? 'on' : ''}" data-act="filtro" data-v="${t.k === 'livres' ? 'todos' : t.k === 'rota' ? 'todos' : t.k}"><div class="tl"><i class="fa-solid fa-${t.ic}"></i>${t.t}</div><div class="tn">${t.n}</div><div class="td">${t.d}</div>${t.btn}</div>`).join('');
  return `<div class="vC ${m ? 'm' : ''}">
    <section class="heroC" data-block="Manchete: números do período">
      <div class="top"><span class="dt">${hoje()} · até ${sc().hora}</span><div class="acts">${segPeriodo()}${btnNovo('ink')}</div></div>
      <div class="main">
        <div class="big"><span class="n">${int(d.corridas)}</span><span class="t">corridas ${S.periodo === 'hoje' ? 'hoje' : 'em ' + d.rot}</span><br><span class="d">${d.delta} sobre ${d.cmp}</span></div>
        <div class="nums">${nums}</div>
        <div><div class="grt"><span>${GRAF[S.periodo].tit}</span><span>${S.periodo === 'hoje' ? '— média dos sábados' : ''}</span></div>${grafico(m ? 90 : 130, false)}</div>
      </div>
    </section>
    <div class="wrap">
      <div class="secC"><h2>Agora</h2><span class="live"><i></i>ao vivo</span><span class="line"></span></div>
      <div class="tC" data-block="Agora: o que pede ação">${tiles}</div>
      <div class="secC"><h2>Pedidos em andamento</h2><span class="line"></span><span class="lnk" style="font-size:13px;color:var(--brand-text);font-weight:700;cursor:pointer" data-act="nav" data-n="Operações">Ver em Operações →</span></div>
      <div class="gC">
        <div class="card" data-block="Fila ao vivo" style="overflow:hidden"><div style="padding-top:12px">${filtros()}</div>${m ? `<div class="fcwrap">${lista(cartao)}</div>` : tabelaC()}</div>
        <div class="card" data-block="Mapa ao vivo"><div class="card-h"><h3>Mapa</h3><span class="sub">${o.on} online</span>${m ? '' : `<span class="lnk" data-act="nav" data-n="Operações (mapa)">Tela cheia →</span>`}</div><div style="padding:0 12px 6px">${mapa(m ? 300 : 420, '', !m)}</div><div style="padding:4px 14px 12px">${legenda()}</div></div>
      </div>
      <div class="gC3">
        <div class="card" data-block="Lojas no período"><div class="card-h"><h3>Lojas</h3><span class="sub">${tituloPer()}</span></div>${listaLojas()}</div>
        <div class="card" data-block="Motoboys no período"><div class="card-h"><h3>Motoboys</h3><span class="sub">${tituloPer()}</span></div>${listaMotos(5)}</div>
        <div class="card" data-block="Atenção"><div class="card-h"><h3>Atenção</h3><span class="sub">${atencao().length} itens</span></div>${itensAtencao()}</div>
      </div>
    </div>
  </div>`;
}

/* ======================= render ======================= */
function frame(v, availW) {
  const m = mob();
  const W = m ? 390 : S.vp;
  const corpo = { a: corpoA, b: corpoB, c: corpoC }[v](m);
  const s = Math.min(1, availW / (W + (m ? 20 : 0)));
  return `<div class="frame ${m ? 'phone' : ''}" style="zoom:${s}"><div class="pf ${m ? 'm' : ''}" style="width:${W}px">${cabecalhoConsole(m)}${corpo}</div></div>`;
}
function render() {
  document.getElementById('vtabs').innerHTML = `<span class="lbl">Painel</span>` +
    ['a', 'b', 'c'].map(k => `<button class="chip ${S.variant === k ? 'on' : ''}" data-v="${k}">${VARIANTS[k].nome}</button>`).join('') +
    `<button class="chip cmp ${S.variant === 'cmp' ? 'on' : ''}" data-v="cmp"><i class="fa-solid fa-table-columns"></i> Comparar por tela</button>`;
  document.getElementById('stabs').innerHTML = `<span class="lbl">Tela</span>` + SCREENS.map(([n, t]) => `<button class="chip ${S.screen === n ? 'on' : ''}" data-s="${n}">${t}</button>`).join('');
  document.getElementById('desc').innerHTML = S.variant === 'cmp'
    ? '<b>Comparar por tela:</b> A, B e C lado a lado, na mesma tela. Período, filtros e "Atribuir" valem para os três.'
    : VARIANTS[S.variant].desc;
  const stage = document.getElementById('stage');
  const availW = window.innerWidth - 48;
  if (S.variant === 'cmp') {
    stage.className = 'cmpgrid';
    stage.innerHTML = ['a', 'b', 'c'].map(v => `<div class="cmpcol"><h3>${VARIANTS[v].nome}</h3>${frame(v, (availW - 32) / 3)}</div>`).join('');
  } else {
    stage.className = 'single';
    stage.innerHTML = frame(S.variant, availW);
  }
}

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000); }

/* atribuir na mão: motoboys livres por distância até a loja, desempate por menos corridas hoje */
function abrirAtribuir(id) {
  const p = sc().pedidos.find(x => x.id === id); if (!p) return;
  const l = LOJAS[p.loja];
  const livres = motosOnline().filter(m => m.st === 'livre').map(m => {
    const km = Math.hypot(m.x - l.x, (m.y - l.y) * .7) / 9;
    const mo = MOTOS.find(x => x.nome === m.nome);
    return { ...m, km, corridas: mo.corridas };
  }).sort((a, b) => Math.abs(a.km - b.km) < .3 ? a.corridas - b.corridas : a.km - b.km);
  const md = document.getElementById('modal');
  md.innerHTML = `<div class="box">
    <div class="mh"><h2>Atribuir ${numTxt(p)}</h2><p>${l.nome} → ${p.cliente}, ${p.bairro}</p></div>
    <div class="ml">${livres.length ? livres.map(m => `<div class="mr"><img src="${capSrc('livre')}" alt=""><div><b>${m.nome}</b><small>${m.km.toFixed(1).replace('.', ',')} km da loja · ${m.corridas} corridas hoje</small></div><button class="btn sm brand" data-act="enviar" data-id="${p.id}" data-m="${m.nome}">Enviar</button></div>`).join('') : '<div class="mr"><div>Nenhum motoboy livre agora.<small>A distribuição segue oferecendo aos que forem ficando livres.</small></div></div>'}</div>
    <div class="mf"><i class="fa-solid fa-circle-info"></i> A distribuição continua oferecendo até você escolher.<button class="btn sm ghost" data-act="fechar">Cancelar</button></div>
  </div>`;
  md.classList.add('show');
}

document.addEventListener('click', (e) => {
  const vt = e.target.closest('#vtabs [data-v]');
  if (vt) { S.variant = vt.dataset.v; render(); return; }
  const st = e.target.closest('#stabs [data-s]');
  if (st) { S.screen = +st.dataset.s; S.filtro = 'todos'; render(); return; }
  if (e.target.id === 'modal') { e.target.classList.remove('show'); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'busca') return;
  if (act === 'periodo') { S.periodo = el.dataset.v; render(); return; }
  if (act === 'filtro') { e.stopPropagation(); S.filtro = S.filtro === el.dataset.v && el.dataset.v !== 'todos' ? 'todos' : el.dataset.v; render(); return; }
  if (act === 'atribuir') { e.stopPropagation(); abrirAtribuir(el.dataset.id); return; }
  if (act === 'fechar') { document.getElementById('modal').classList.remove('show'); return; }
  if (act === 'enviar') {
    const p = sc().pedidos.find(x => x.id === el.dataset.id);
    const pos = sc().livresPos[el.dataset.m] || [50, 50];
    Object.assign(p, { st: 'loja', moto: el.dataset.m, mx: pos[0], my: pos[1] });
    document.getElementById('modal').classList.remove('show');
    toast(`Pedido ${numTxt(p)} enviado para ${el.dataset.m}`);
    render(); return;
  }
  if (act === 'pedido') { toast(`Abre o pedido ${numTxt(sc().pedidos.find(x => x.id === el.dataset.id))} (detalhe do sketch 007)`); return; }
  if (act === 'nav') { toast(el.dataset.n === 'Painel' ? 'Você já está no Painel' : 'Abre ' + el.dataset.n); return; }
  if (act === 'toast') { toast(el.dataset.msg); return; }
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const i = document.querySelector('.pf [data-act="busca"]'); if (i) i.focus(); }
  if (e.key === 'Escape') document.getElementById('modal').classList.remove('show');
});

/* relógio das ofertas: cada rodada dura 50 s; depois da 3ª, recomeça */
setInterval(() => {
  sc().pedidos.filter(p => p.st === 'oferta').forEach(p => {
    p.cd--;
    if (p.cd < 0) { p.cd = 50; p.rodada = p.rodada >= 3 ? 1 : p.rodada + 1; }
    document.querySelectorAll(`[data-cd="${p.id}"]`).forEach(s => s.textContent = mmss(p.cd));
    document.querySelectorAll(`[data-rd="${p.id}"]`).forEach(s => s.textContent = p.rodada);
  });
}, 1000);

document.getElementById('theme-switcher').addEventListener('change', (e) => {
  document.getElementById('theme').href = '../themes/' + e.target.value + '.css';
  document.body.classList.toggle('dark-chrome', e.target.value !== 'entregas');
});
document.querySelectorAll('#sketch-tools [data-vp]').forEach(b => b.addEventListener('click', () => {
  S.vp = +b.dataset.vp; document.querySelectorAll('#sketch-tools [data-vp]').forEach(x => x.classList.toggle('on', x === b)); render();
}));
document.getElementById('annot-btn').addEventListener('click', (e) => { document.body.classList.toggle('annot'); e.target.classList.toggle('on'); });
window.addEventListener('resize', render);
render();
</script>
